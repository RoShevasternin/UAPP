<title>Seciro Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter — змінний, з віссю opsz: Figma малює Inter з opsz 14 на будь-якому кеглі (заміряно 24.11: «Try 3 Days for $0.99»
     157.1 px = Figma 157), а Chrome сам підганяє opsz під кегль і текст стає вужчим → інші переноси рядків -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,700&family=Inter+Tight:wght@500;700&display=block">
<style>
/* Сторінка-обгортка прототипу: телефон 375×812 (кадр Figma) по центру + панель екранів.
   Сама апка всередині телефона — світла, як у Figma; обгортка йде за темою переглядача. */
:root {
  --page: #e7ebf2;
  --panel: #ffffff;
  --ink: #141a24;
  --muted: #5d6675;
  --line: #d5dbe5;
  --accent: #0b62da;
  --chip: #eef3fb;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f141c; --panel: #171e29; --ink: #e8edf5; --muted: #98a3b4; --line: #2a3443; --accent: #5b9bff; --chip: #1f2a3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f141c; --panel: #171e29; --ink: #e8edf5; --muted: #98a3b4; --line: #2a3443; --accent: #5b9bff; --chip: #1f2a3a;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--ui); }
#root { min-height: 100%; }

.stage {
  display: flex; gap: 28px; align-items: flex-start; justify-content: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.phone-slot { flex: 0 0 auto; }
.phone-shell {
  border-radius: 44px; padding: 10px; background: #0d1118;
  box-shadow: 0 24px 60px rgba(8, 30, 70, .28), inset 0 0 0 1.5px #2b3240;
}
.phone-clip { border-radius: 34px; overflow: hidden; position: relative; }

.panel {
  width: 300px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
  /* панель тримається на екрані, а скролиться лише список екранів */
  position: sticky; top: 24px; max-height: calc(100vh - 48px); box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
}
.panel > * { flex: none; }
.panel .scr-list { flex: 0 1 auto; min-height: 150px; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain;
  margin-right: -10px; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.panel .scr-list::-webkit-scrollbar { width: 6px; }
.panel .scr-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.panel h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.panel .sub { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.45; }
.panel .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.scr-list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.scr-list button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); font: 500 13px/1.3 var(--ui);
  padding: 7px 10px; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
}
.scr-list button:hover { background: var(--chip); }
.scr-list button[aria-current="true"] { background: var(--accent); color: #fff; }
.scr-list button { display: flex; align-items: center; gap: 7px; }
.scr-list .nm { flex: 1 1 auto; min-width: 0; }
.scr-list .dot, .legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.scr-list button[aria-current="true"] .dot { box-shadow: 0 0 0 2px #fff; }
.scr-list .new { font: 700 9px/1 var(--ui); font-style: normal; letter-spacing: .06em; color: #fff; background: #1f9d55; padding: 3px 5px; border-radius: 5px; flex: none; }
.pbtn.sm { font-size: 11px; padding: 4px 8px; text-transform: none; letter-spacing: 0; }
.newbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 1.35; color: var(--muted);
  background: var(--chip); border-radius: 12px; padding: 8px 10px; }
.newbar b { color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.notes li { font-weight: 400; }
.notes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.42; padding: 6px 8px; border-radius: 10px; cursor: default; background: var(--chip); }
.notes li.on { outline: 1.5px solid var(--accent); }
.notes .num { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid; display: inline-flex; align-items: center; justify-content: center;
  font: 700 10px/1 var(--ui); box-sizing: border-box; margin-top: 1px; }
.notes .kind { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.ex-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.ex-cap { align-items: center; }
.ex-view { position: absolute; inset: 0; background: #f2f3f6; }
.ex-label { position: absolute; left: 10px; right: 10px; bottom: 12px; background: rgba(20,26,36,.86); color: #fff; border-radius: 12px; padding: 8px 12px; font: 600 13px/1.35 var(--ui); }
.ex-label span { display: block; font-weight: 400; font-size: 11px; opacity: .75; }
.mark { position: absolute; border: 2.5px solid; border-radius: 12px; box-sizing: border-box; transition: opacity .2s, background .2s; }
.mark span { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; border-radius: 50%; color: #fff; font: 700 11px/20px var(--ui); text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.scr-list .nid { opacity: .6; font-variant-numeric: tabular-nums; font-size: 11px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.pbtn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 13px var(--ui);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.pbtn:hover { border-color: var(--accent); }
.pbtn:focus-visible, .scr-list button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
.note b { color: var(--ink); font-weight: 600; }
.pbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.pbtn:disabled { opacity: .45; cursor: default; }
.cap { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 12px 10px; font-size: 12px; color: var(--muted); }
.cap b { color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.noframe { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px;
  font: 500 14px/1.45 var(--ui); color: #737373; }
input[type="range"] { accent-color: var(--accent); }

@media (max-width: 1000px) {
  .stage { flex-direction: column; align-items: center; padding-block: 12px; gap: 16px; }
  .panel { width: 100%; max-width: 420px; box-sizing: border-box; position: static; max-height: none; }
  .panel .scr-list { max-height: 45vh; }
  .phone-shell { border-radius: 0; padding: 0; background: transparent; box-shadow: none; }
  .phone-clip { border-radius: 18px; }
}

/* ── Всередині апки ── */
.app, .app * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* claude.ai обгортає сторінку з img{max-width:100%}; у рендерері картинки бувають у контейнері нульової ширини → без цього зникають */
.app img { max-width: none; }
.app { font-family: "Inter", sans-serif; font-weight: 500; color: #000; user-select: none;
  /* як Figma: opsz 14 на всіх кеглях і тонке (сіре) згладжування — без «потовщення» гліфів, яке Chrome на Маці робить за замовчуванням */
  font-optical-sizing: none; font-variation-settings: "opsz" 14;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: geometricPrecision; }
.tap { cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.tap:active { transform: scale(.98); filter: brightness(.94); }
.tap-soft { transition: background-color .15s ease; border-radius: 12px; }
.tap-soft:active { background-color: rgba(11,98,218,.05); }
.hscroll { overflow-x: auto; scrollbar-width: none; cursor: grab; }
.hscroll::-webkit-scrollbar { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes inFwd { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes inBack { from { transform: translateX(-28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
/* ілюстрації в спокої: дрібне пливе, іскри мерехтять, пляма фону дихає (зсуви малі — кадр лишається кадром Figma) */
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(.78) rotate(18deg); opacity: .75; } }
@keyframes breathe { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.035) rotate(-2deg); } }
.float { animation: float 3.6s ease-in-out infinite; }
.twinkle { animation: twinkle 2.8s ease-in-out infinite; }
.breathe { animation: breathe 9s ease-in-out infinite; }
/* paywall: каскад знизу після «Get Started» */
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
.enter-up > * { animation: rise .62s cubic-bezier(.16,1,.3,1) both; }
.enter-up > *:nth-child(1) { animation-name: pop; animation-duration: .8s; }
@keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
.enter-up > *:nth-child(2) { animation: fade .5s ease both; }
.enter-up > *:nth-child(3), .enter-up > *:nth-child(4) { animation: fade .3s ease both; animation-delay: .2s; }
.enter-up > *:nth-child(5) { animation-delay: .08s; } .enter-up > *:nth-child(6) { animation-delay: .14s; }
.enter-up > *:nth-child(7) { animation-name: slideIn; animation-delay: .2s; animation-duration: .8s; }
@keyframes slideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
.enter-up > *:nth-child(8) { animation-delay: .27s; } .enter-up > *:nth-child(9) { animation-delay: .33s; }
.enter-up > *:nth-child(10) { animation-delay: .38s; } .enter-up > *:nth-child(11) { animation-delay: .42s; }
.enter-up > *:nth-child(12) { animation-delay: .46s; }
.enter-none { }
/* Переходи між екранами у два шари (як push у нативних апках): новий заїжджає, старий відсувається й тьмяніє */
@keyframes pushIn { from { transform: translateX(100%); } to { transform: none; } }
@keyframes pushOut { from { transform: none; filter: none; } to { transform: translateX(-30%); filter: brightness(.9); } }
@keyframes popBackIn { from { transform: translateX(-30%); filter: brightness(.9); } to { transform: none; filter: none; } }
@keyframes popBackOut { from { transform: none; } to { transform: translateX(100%); } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes riseUpIn { from { transform: translateY(6%); opacity: 0; } to { transform: none; opacity: 1; } }
.scr-in-fwd { animation: pushIn .44s cubic-bezier(.2,.85,.25,1) both; z-index: 2; box-shadow: -10px 0 30px rgba(8,30,70,.10); }
.scr-out-fwd { animation: pushOut .44s cubic-bezier(.2,.85,.25,1) both; z-index: 1; }
.scr-in-back { animation: popBackIn .44s cubic-bezier(.2,.85,.25,1) both; z-index: 1; }
.scr-out-back { animation: popBackOut .44s cubic-bezier(.2,.85,.25,1) both; z-index: 2; box-shadow: -10px 0 30px rgba(8,30,70,.10); }
.scr-in-fade { animation: fade .38s ease both; z-index: 2; }
.scr-out-fade { animation: fadeOut .38s ease both; z-index: 1; }
.scr-in-up { animation: riseUpIn .45s cubic-bezier(.2,.85,.25,1) both; z-index: 2; }
.scr-out-up { animation: fadeOut .4s ease both; z-index: 1; }
.scr-in-none, .scr-out-none { z-index: 2; }
/* ряд 2: курсор, поява цифри, струс при неправильному коді, поява ілюстрації */
@keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
.caret { animation: blink 1.05s step-end infinite; }
@keyframes digitIn { from { transform: translateY(6px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.digit { display: inline-block; animation: digitIn .22s cubic-bezier(.2,.9,.3,1.4); }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } to { transform: none; } }
.pop-in > * { animation: popIn .6s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 60%; }
/* ряд 3 */
@keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rise { animation: riseIn .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes floatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.float-slow { animation: floatSlow 4.5s ease-in-out infinite; }
@keyframes breatheSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
.breathe-soft { animation: breatheSoft 2.4s ease-in-out infinite; }
.spin-arc { animation: spin .9s linear infinite; -webkit-mask-image: conic-gradient(#000 0deg 250deg, transparent 250deg); mask-image: conic-gradient(#000 0deg 250deg, transparent 250deg); }
@keyframes popIcon { from { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } to { transform: none; } }
.pop-icon { animation: popIcon .4s cubic-bezier(.2,.8,.2,1) both; }
/* ряд 4: VPN */
@keyframes vpnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
.vpn-pulse { animation: vpnPulse 4s ease-in-out infinite; transform-origin: 187.5px 352px; }
.vpn-pulse-fast { animation: vpnPulse 1.1s ease-in-out infinite; transform-origin: 187.5px 352px; }
@keyframes vpnSpin { to { transform: rotate(360deg); } }
.vpn-btn-connecting > div > img { animation: vpnBtnPulse 1.1s ease-in-out infinite; }
@keyframes vpnBtnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(.94); } }
.vpn-btn-pop > div > img { animation: popIcon .45s cubic-bezier(.2,.8,.2,1); }
@keyframes arcSpin { to { transform: rotate(360deg); } }
.vpn-arc-spin { animation: arcSpin 1.1s linear infinite; transform-origin: 50% 50%; }
.fig-scroll { scrollbar-width: none; } .fig-scroll::-webkit-scrollbar { display: none; }
.raw, .raw * { animation: none !important; transition: none !important; }
.enter-fwd { animation: inFwd .32s cubic-bezier(.2,.8,.2,1); }
.enter-back { animation: inBack .32s cubic-bezier(.2,.8,.2,1); }
.enter-fade { animation: fade .3s ease; }
@media (prefers-reduced-motion: reduce) {
  .enter-fwd, .enter-back, .enter-fade, .enter-up > *, .float, .twinkle, .breathe,
  [class^="scr-in-"], [class^="scr-out-"] { animation: none !important; }
}
</style>
<div id="root"></div>
