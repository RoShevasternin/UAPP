<!doctype html>
<!-- Шаблон feature graphic для Google Play (1024×500). Рендерить render_brand.js:
     маркер-коментар LOGO у .brand замінюється на LOGO(150) з прототипу, IMG у фігурних дужках — на шлях до prototype/img.
     Стиль — як у прототипа: майже чорний фон, червоне «концертне» світло, Archivo 118% / 800. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--bg:#0a0607;--fg:#f7edef;--muted:#a8949b;--red:#ff2e4d}
*{box-sizing:border-box}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:var(--bg)}
body{position:relative;font-family:"Archivo",system-ui,sans-serif;color:var(--fg);
  background:
    radial-gradient(560px 420px at 14% 22%,rgba(255,46,77,.26),transparent 68%),
    radial-gradient(640px 460px at 80% 78%,rgba(184,0,31,.34),transparent 66%),
    radial-gradient(420px 300px at 74% 4%,rgba(255,90,108,.16),transparent 70%),
    var(--bg)}
/* легке зерно-віньєтка по краях */
body::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}

.brand{position:absolute;left:76px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;z-index:2}
.logo{flex:none;display:block;margin-left:-4px;filter:drop-shadow(0 18px 36px rgba(255,46,77,.55))}
.word{font-stretch:118%;font-weight:800;font-size:82px;line-height:.9;letter-spacing:-.025em;margin:26px 0 0}
.sub{display:block;margin-top:16px;font-stretch:125%;font-weight:700;font-size:19px;letter-spacing:.3em;white-space:nowrap;color:var(--muted)}

.fan{position:absolute;left:760px;top:124px;width:0;height:0;z-index:1}
.fan img{position:absolute;left:-90px;top:0;width:180px;height:180px;border-radius:20px;object-fit:cover;
  transform-origin:50% 200%;
  box-shadow:0 30px 50px -14px rgba(0,0,0,.85),0 10px 30px -10px rgba(255,46,77,.35),0 0 0 1px rgba(255,255,255,.07)}
/* віяло: ліва карта зверху, решта визирає праворуч */
.fan img:nth-child(1){transform:rotate(-25.5deg);z-index:4}
.fan img:nth-child(2){transform:rotate(-8.5deg);z-index:3}
.fan img:nth-child(3){transform:rotate(8.5deg);z-index:2}
.fan img:nth-child(4){transform:rotate(25.5deg);z-index:1}
</style>
</head>
<body>
  <div class="brand">
    <!--LOGO-->
    <div>
      <h1 class="word">Redwave</h1>
      <span class="sub">MUSIC DOWNLOADER</span>
    </div>
  </div>
  <div class="fan" aria-hidden="true">
    <img src="{{IMG}}/c-neon-heart.jpg" alt="">
    <img src="{{IMG}}/c-night-drive.jpg" alt="">
    <img src="{{IMG}}/c-smoke.jpg" alt="">
    <img src="{{IMG}}/c-bass-theory.jpg" alt="">
  </div>
<script>
document.fonts.ready.then(()=>{
  const box=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width;};
  const w=document.querySelector(".word"),t=document.querySelector(".sub");
  const n=t.textContent.length,ls=parseFloat(getComputedStyle(t).letterSpacing)||0;
  const cur=box(t)-ls; /* остання літера теж несе letter-spacing — не рахуємо його */
  t.style.letterSpacing=(ls+(box(w)-cur)/(n-1)).toFixed(2)+"px";
  document.body.dataset.ready="1";});
</script>
</body>
</html>
