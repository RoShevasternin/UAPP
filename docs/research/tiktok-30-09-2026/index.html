<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Жива версія: https://claude.ai/artifact/6b4V38PXrJJvnUecVa93VP · Копія від 30.09.2026. Правиш артефакт — перезбережи й цей файл. -->
<title>Що TikTok-аудиторія хоче безкоштовно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: липка панель VELDAN з мовами, звітна колонка 1120px. Попит — графік і картка напряму поруч; симуляція — телефон зі справжнім скріном поруч зі списком кроків.
   Та сама система, що в SMS-звіті: жовтий = реклама і гроші, бірюзовий = дії людини, червоний = проблеми й ризики. */
:root{
  --paper:#F2F3F5; --surface:#FFFFFF; --ink:#141722; --ink-2:#4A5064; --muted:#6B7184; --line:#DADDE3; --grid:#E7E9ED;
  --ad:#F2BF0A; --ad-ink:#241C00; --ad-soft:#FFF3C4;
  --user:#0E7A62; --user-ink:#FFFFFF; --user-soft:#DDF1EB;
  --risk:#B3372B; --risk-soft:#FBE8E5; --on-risk:#FFFFFF;
  --bar:#BCC1CC; --bar-em:#141722;
  --bezel:#1A1C22;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1015; --surface:#161920; --ink:#E8EAF0; --ink-2:#B0B5C3; --muted:#8B91A2; --line:#2A2E39; --grid:#21252E;
    --ad-soft:#3A3211; --user:#3DB396; --user-ink:#05231B; --user-soft:#10302A; --risk:#FF7A6A; --risk-soft:#3B1D1A; --on-risk:#2A0D09;
    --bar:#4A5060; --bar-em:#E8EAF0; --bezel:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1015; --surface:#161920; --ink:#E8EAF0; --ink-2:#B0B5C3; --muted:#8B91A2; --line:#2A2E39; --grid:#21252E;
  --ad-soft:#3A3211; --user:#3DB396; --user-ink:#05231B; --user-soft:#10302A; --risk:#FF7A6A; --risk-soft:#3B1D1A; --on-risk:#2A0D09;
  --bar:#4A5060; --bar-em:#E8EAF0; --bezel:#000000;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);margin:0}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;color:inherit}
section{scroll-margin-top:64px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.k{font:500 11.5px/1.35 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2{font:500 clamp(22px,3.2vw,32px)/1.15 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h3,h4{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.bar-left{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font:700 15px/1 var(--f-display);letter-spacing:.22em;white-space:nowrap}
.bar-k{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;border-left:1px solid var(--line)}
@media (max-width:520px){.bar-k{display:none}}
.langs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:none}
.langs button{appearance:none;border:0;background:none;color:var(--ink-2);font:600 12px/1 var(--f-mono);letter-spacing:.06em;padding:8px 10px;border-radius:7px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* header */
.top{padding-block:clamp(28px,6vw,64px) clamp(24px,4vw,40px)}
h1{font:700 clamp(30px,5.4vw,56px)/1.05 var(--f-display);letter-spacing:-.025em;margin:14px 0 18px;max-width:17ch;text-wrap:balance}
.lede{font-size:clamp(17px,2.1vw,20px);line-height:1.5;color:var(--ink-2);max-width:64ch;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font:600 12px/1 var(--f-mono);flex:none}
.tag.ok{background:var(--ink);color:var(--paper)}
.tag.guess{border:1.5px dashed var(--muted);color:var(--ink-2)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.toc a{font-size:14px;text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);background:var(--surface)}
.toc a:hover{border-color:var(--ink-2);color:var(--ink)}

/* blocks */
.block{padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.block.alt{background:var(--surface)}
.block-head{display:grid;gap:10px;margin-bottom:28px;max-width:72ch}
.block-head p{margin:0;color:var(--ink-2)}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.sm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0}
.sm h3{font:600 17px/1.3 var(--f-body);margin:0;display:flex;gap:10px;align-items:flex-start}
.sm h3 .tag{margin-top:1px}
.sm p{margin:0;font-size:15px;color:var(--ink-2)}
.sm.us{border:1.5px solid var(--ink)}
.sm .go{font-size:14px;font-weight:500;justify-self:start}

/* segmented controls */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:100%}
.seg button{appearance:none;border:0;background:none;color:var(--ink-2);font:500 14px/1.25 var(--f-body);padding:8px 13px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.block.alt .seg{background:var(--paper)}

/* demand */
.dem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,3vw,36px);align-items:start}
@media (max-width:900px){.dem{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,22px);min-width:0;position:relative}
.chart-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.chart-top h3{font:600 16px/1.3 var(--f-body);margin:0}
.bars{display:grid;gap:2px}
.brow{appearance:none;border:0;background:none;text-align:left;width:100%;display:grid;grid-template-columns:minmax(0,9.6em) minmax(0,1fr) 4.6em;gap:10px;align-items:center;font-size:14px;padding:7px 8px;border-radius:8px;cursor:pointer}
.brow:hover{background:var(--paper)}
.brow[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.brow .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.brow[aria-pressed="true"] .lab{color:var(--ink);font-weight:600}
.bplot{height:14px;position:relative;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:25% 100%;box-shadow:inset -1px 0 0 var(--grid)}
.bplot i{position:absolute;left:0;top:1px;bottom:1px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.brow[aria-pressed="true"] .bplot i{background:var(--bar-em)}
.bplot .ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.brow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.axis{display:grid;grid-template-columns:minmax(0,9.6em) minmax(0,1fr) 4.6em;gap:10px;font:500 11px/1 var(--f-mono);color:var(--muted);margin-top:8px;padding-inline:8px}
.ticks{position:relative;height:12px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.chart-note{margin:14px 0 0;font-size:13px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:250px;z-index:5}
.dir{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,24px);display:grid;gap:16px;min-width:0}
.dir-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.dir-head h3{font:500 clamp(19px,2.4vw,23px)/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.dir-stats{font:500 13px/1.3 var(--f-mono);color:var(--muted)}
.verd{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.verd.ok{background:var(--ink);color:var(--paper)}
.verd.mixed{border:1.5px dashed var(--ink-2);color:var(--ink)}
.verd.bad{background:var(--risk);color:var(--on-risk)}
.dl{display:grid;gap:12px;margin:0}
.dl div{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 16px;padding-bottom:12px;border-bottom:1px solid var(--grid)}
.dl div:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:560px){.dl div{grid-template-columns:minmax(0,1fr)}}
.dl dt{font:500 12px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:0;font-size:15px}
.hooks{display:flex;flex-wrap:wrap;gap:6px}
.hk{font:500 13px/1.2 var(--f-mono);padding:5px 9px;border-radius:7px;background:var(--ad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--ad) 55%,transparent)}
.dd-money{display:flex;gap:8px;align-items:flex-start}
.coin{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ad);color:var(--ad-ink);display:grid;place-items:center;font:700 11px/1 var(--f-mono);margin-top:3px}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.alist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--grid);font-size:14px}
.alist li:last-child{border-bottom:0}
.alist a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.alist .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.ico{width:28px;height:28px;border-radius:7px;background:var(--grid);display:block;object-fit:cover}
.ico.lg{width:40px;height:40px;border-radius:10px}

/* hooks board */
.motives{display:grid;gap:10px}
.mv{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:14px 22px;padding:16px 20px;align-items:start}
@media (max-width:900px){.mv{grid-template-columns:minmax(0,1fr) auto}.mv .c2,.mv .c3{grid-column:1/-1}}
.mv h3{font:600 16.5px/1.3 var(--f-body);margin:0}
.mv .sub{font-size:13.5px;color:var(--ink-2);margin:2px 0 0}
.mv .c3 p{margin:0;font-size:14.5px;color:var(--ink-2)}
.mv .lbl{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.arrowcol{display:none}
.words{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr);gap:0;max-width:720px}
.words h3{font:600 16px/1.3 var(--f-body);margin:0 0 10px}
.wrow{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.wrow .bplot{height:12px}
.wrow .val{text-align:right;font-variant-numeric:tabular-nums}

/* simulation */
.sim-tabs{margin-top:22px}
.sim{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(22px,4vw,56px);margin-top:26px;align-items:start}
@media (max-width:820px){.sim{grid-template-columns:minmax(0,1fr)}}
.device{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.phone{width:280px;max-width:100%;aspect-ratio:300/669;background:var(--bezel);border-radius:40px;padding:8px;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(8,10,16,.5)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;border-radius:33px;background:#000}
.pager{display:flex;align-items:center;gap:10px}
.pbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px}
.pbtn:disabled{opacity:.4;cursor:default}
.pcount{font:500 13px/1 var(--f-mono);color:var(--muted);min-width:4.5em;text-align:center}
.sim-note{font-size:12.5px;color:var(--muted);text-align:center;margin:0;max-width:300px}
.panel{display:grid;gap:18px;min-width:0}
.ph{display:flex;gap:14px;align-items:center}
.ph h3{font:600 20px/1.2 var(--f-body);margin:0}
.ph .meta{font-size:13.5px;color:var(--ink-2);margin:2px 0 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;cursor:pointer}
.step[aria-current="step"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.step .no{font:500 13px/1.5 var(--f-mono);color:var(--muted)}
.step b{font-weight:600}
.step p{margin:0;grid-column:2;font-size:14.5px;color:var(--ink-2)}
.mark{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:5px;margin-left:8px;vertical-align:2px}
.mark.money{background:var(--ad);color:var(--ad-ink)}
.mark.user{background:var(--user);color:var(--user-ink)}
.mark.risk{background:var(--risk);color:var(--on-risk)}
.mark.ok{background:var(--ink);color:var(--paper)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:0}
.kv div{display:grid;gap:2px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.kv dt{color:var(--muted);font:500 11.5px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}
.sim-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--ink-2);margin:14px 0 0;padding:0;list-style:none}
.sim-legend .mark{margin-left:0}

/* exchange */
.ex{margin-top:clamp(40px,6vw,64px);display:grid;gap:22px}
.ex h3{font:500 clamp(19px,2.4vw,23px)/1.2 var(--f-display);margin:0}
.ex > p{margin:0;color:var(--ink-2);max-width:70ch}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:f;position:relative}
@media (max-width:860px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.flow{grid-template-columns:minmax(0,1fr)}}
.flow li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;position:relative}
.flow li::before{content:counter(f);font:600 12px/1 var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.flow b{font-size:15px;line-height:1.3}
.flow span{font-size:13.5px;color:var(--ink-2)}
.flow li.loss{background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 35%,transparent)}
.flow .mark{margin:4px 0 0;justify-self:start}
.loop{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,22px);display:grid;gap:14px;max-width:760px}
.calc label{font-weight:600}
.calc-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.calc input[type=range]{flex:1;min-width:180px;accent-color:var(--ink)}
.calc output{font:600 22px/1 var(--f-display);min-width:3.5em;font-variant-numeric:tabular-nums}
.calc-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.calc-res{grid-template-columns:minmax(0,1fr)}}
.cr{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.cr.u{background:var(--user-soft)}
.cr.m{background:var(--ad-soft)}
.cr b{font:600 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.cr span{font-size:14px;color:var(--ink-2)}
.calc small{color:var(--muted);font-size:13px}

/* heatmap */
.hm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:760px;font-size:13.5px}
.hm th{font:500 11px/1.25 var(--f-mono);letter-spacing:.03em;color:var(--muted);text-align:center;padding:10px 6px;vertical-align:bottom}
.hm th.rh{text-align:left;font:500 14px/1.3 var(--f-body);color:var(--ink);letter-spacing:0;padding:6px 10px;white-space:nowrap;vertical-align:middle}
.hm th.rh small{display:block;color:var(--muted);font:500 11px/1.3 var(--f-mono)}
.hm tr.ctl th.rh{color:var(--ink-2)}
.hm td{padding:0}
.cell{appearance:none;width:100%;min-height:42px;border:0;border-radius:6px;cursor:pointer;font:600 13.5px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.cell[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.hm-scale{display:flex;align-items:center;gap:8px;font:500 11.5px/1 var(--f-mono);color:var(--muted);margin-top:12px}
.hm-scale i{display:block;width:140px;height:10px;border-radius:3px;background:linear-gradient(to right,var(--surface),color-mix(in srgb,var(--risk) 72%,var(--surface)));box-shadow:inset 0 0 0 1px var(--line)}
.reads{margin:22px 0 0;padding-left:1.1em;display:grid;gap:8px;max-width:78ch}
.reads li{color:var(--ink-2)}
.reads b{color:var(--ink)}
.qhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:30px 0 14px}
.qhead h3{font:600 18px/1.3 var(--f-body);margin:0}
.qhead span{color:var(--muted);font-size:14px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0;margin:0}
.qcard.hit{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.qmeta b{color:var(--ink);font-family:var(--f-body);font-size:13.5px;font-weight:600}
.qcard blockquote{margin:0;font-size:14.5px;line-height:1.5}
.qcard .tr{margin:0;font-size:14.5px;color:var(--ink-2)}
.qth{display:flex;flex-wrap:wrap;gap:5px}
.qth span{font:500 11px/1 var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--risk-soft);color:var(--ink)}
.empty{color:var(--muted);font-size:14.5px;margin:0}

/* table */
.tctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 13.5px/1 var(--f-body);padding:8px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;min-width:0;width:220px;max-width:100%;color:var(--ink)}
.shown{font:500 12.5px/1 var(--f-mono);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.apps{border-collapse:collapse;width:100%;min-width:1080px;font-size:14px}
table.apps th,table.apps td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
table.apps th{font:500 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.apps th button{appearance:none;border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
table.apps th button[data-on="1"]{color:var(--ink)}
table.apps td.num,table.apps th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.apps tr:last-child td{border-bottom:0}
.appcell{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;min-width:200px}
.appcell a{font-weight:600;line-height:1.3}
.appcell small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.hookcell{color:var(--ink-2);min-width:220px;max-width:300px;font-size:13.5px}
.pill{display:inline-block;font:500 11px/1.2 var(--f-mono);padding:3px 6px;border-radius:5px;margin:0 4px 4px 0;white-space:nowrap}
.pill.ad{background:var(--ad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--ad) 55%,transparent)}
.pill.th{background:var(--risk-soft);color:var(--ink)}
.pill.flag{background:var(--risk);color:var(--on-risk)}
.pill.add{background:var(--user-soft);color:var(--ink)}
.pill.dir{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.moneycell{min-width:150px;font-size:13px;color:var(--ink-2)}

/* money */
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.model{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:10px;align-content:start}
.model h3{font:600 17px/1.3 var(--f-body);margin:0}
.model .who{font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.03em}
.model p{margin:0;font-size:14.5px;color:var(--ink-2)}
.model .rk{font-size:14px;color:var(--ink);background:var(--risk-soft);border-radius:10px;padding:8px 10px}
.law{margin:24px 0 0;background:var(--ad-soft);border-radius:14px;padding:16px 18px;max-width:80ch;font-size:15.5px}
.sdkbox{margin-top:30px;display:grid;gap:12px}
.sdkbox h3{font:600 17px/1.3 var(--f-body);margin:0}
.sdkbox > p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:75ch}
.sdkrow{display:grid;grid-template-columns:minmax(0,11em) 3em minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--grid);font-size:14px}

.sdkrow b{font-weight:600}
.sdkrow .cnt{font:600 14px/1.5 var(--f-mono);text-align:right}
.sdk{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.sdk li{font:500 11.5px/1 var(--f-mono);padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.sdk li.adn{background:var(--ad-soft);border-color:color-mix(in srgb,var(--ad) 55%,transparent)}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.nt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,22px);display:grid;gap:12px;align-content:start;min-width:0}
.nt h3{font:600 17px/1.3 var(--f-body);margin:0}
.nt-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.nt-row p{margin:0;font-size:14.5px}
.nt-row .lb{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nt-row .chk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--user-soft);color:var(--user);font:700 13px/1 var(--f-mono)}

/* us */
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.ls{border-left:3px solid var(--user);padding:4px 0 4px 14px}
.ls b{display:block;font-size:16px;margin-bottom:2px}
.ls p{margin:0;font-size:14.5px;color:var(--ink-2)}
.ideas{display:grid;gap:14px;margin-top:34px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,24px);display:grid;gap:14px}
.idea-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.idea-head h3{font:500 clamp(18px,2.3vw,21px)/1.25 var(--f-display);margin:0}
.lvl{font:600 11.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
.lvl.low{background:var(--user-soft);color:var(--ink)}
.lvl.mid{background:var(--ad-soft);color:var(--ink)}
.lvl.high{background:var(--risk-soft);color:var(--ink)}
.idea .dl div{grid-template-columns:minmax(0,9em) minmax(0,1fr)}

.nope{margin-top:30px;display:grid;gap:10px;max-width:84ch}
.nope h3{font:600 18px/1.3 var(--f-body);margin:0}
.nope ul{margin:0;padding-left:1.1em;display:grid;gap:8px}
.nope li{color:var(--ink-2)}
.nope b{color:var(--ink)}
.verdict{background:var(--surface);border:1.5px solid var(--ink);border-radius:18px;padding:clamp(18px,3vw,26px);display:grid;gap:10px;margin-top:30px;max-width:84ch}
.verdict h3{font:500 clamp(19px,2.4vw,23px)/1.25 var(--f-display);margin:0;display:flex;gap:10px;align-items:center}
.verdict p{margin:0}

/* sources */
.src-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,48px)}

.plain{margin:0;padding-left:1.1em;display:grid;gap:8px;font-size:15px}
.plain li{color:var(--ink-2)}
.sources{margin:0;padding:0;list-style:none}
.sources li{padding:10px 0;border-bottom:1px solid var(--grid);font-size:15px}
.sources small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
footer{padding-block:34px 44px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line)}

"ex.h":["Біржа підписок: звідки беруться «безкоштовні» підписники","Биржа подписок: откуда берутся «бесплатные» подписчики","The follow exchange: where “free” followers come from"],
"ex.p":["Підписників ніхто не створює. Їх постачають інші користувачі того самого застосунку, які так само заробляють бали. Хто не хоче працювати, купує бали. Так влаштовано більшість застосунків накрутки: TikAi прямо пише, що «ділить підписників між користувачами».","Подписчиков никто не создаёт. Их поставляют другие пользователи того же приложения, которые так же зарабатывают баллы. Кто не хочет работать, покупает баллы. Так устроено большинство приложений накрутки: TikAi прямо пишет, что «делит подписчиков между пользователями».","Nobody creates followers. They come from other users of the same app who are also earning points. Those who don’t want to do the work buy points. Most booster apps work this way: TikAi says outright that it “shares followers between users”."],
"ex.loop":["Ті, хто підписався на тебе, витрачають свої бали, і цикл іде далі. Гроші застосунку приносять реклама між завданнями і продаж балів.","Те, кто подписался на тебя, тратят свои баллы, и цикл идёт дальше. Деньги приложению приносят реклама между заданиями и продажа баллов.","The people who followed you spend their points, and the cycle continues. The app earns from ads between tasks and from selling points."],

"calc.note":["Ціни TikFamous із тесту: 1 підписник = 10 ★, підписка на незнайомця = +5 ★, пакет 250 ★ = $1,99. Великі пакети дешевші до 60 %. Скільки підписників залишиться після відписок, невідомо.","Цены TikFamous из теста: 1 подписчик = 10 ★, подписка на незнакомца = +5 ★, пакет 250 ★ = $1,99. Большие пакеты дешевле до 60 %. Сколько подписчиков останется после отписок, неизвестно.","TikFamous prices from the test: 1 follower = 10 ★, following a stranger = +5 ★, 250 ★ pack = $1.99. Bigger packs are up to 60% cheaper. How many followers stay after unfollows is unknown."],

"money.law":["Спільне правило жанру: реклама чи оплата йде до нагороди, а нагорода приходить потім і з умовою: «зачекай 24 години», «поділись хештегами», «баланс на утриманні 7 днів».","Общее правило жанра: реклама или оплата идёт до награды, а награда приходит потом и с условием: «подожди 24 часа», «поделись хештегами», «баланс на удержании 7 дней».","The common rule of the genre: the ad or payment comes before the reward, and the reward comes later and with a condition: “wait 24 hours”, “share these hashtags”, “balance on hold for 7 days”."],

 {tag:"ok",go:"demand",h:["Найбільший попит — на контент, а не на накрутку","Самый большой спрос — на контент, а не на накрутку","The biggest demand is for content, not fake followers"],
  p:["Завантажувачі без водяного знака (6 застосунків, 143 млн встановлень) і AI-відео (7, 114 млн) більші за накрутку підписників (14, 67 млн). TikTok-монетки — найменший напрям: 4 застосунки, 1,2 млн.","Загрузчики без водяного знака (6 приложений, 143 млн установок) и AI-видео (7, 114 млн) больше накрутки подписчиков (14, 67 млн). TikTok-монеты — самое маленькое направление: 4 приложения, 1,2 млн.","Watermark-free downloaders (6 apps, 143M installs) and AI video (7 apps, 114M) are bigger than follower boosters (14 apps, 67M). TikTok coins is the smallest direction: 4 apps, 1.2M."]},
 {tag:"ok",go:"system",h:["Накрутка — це біржа підписок","Накрутка — это биржа подписок","Boosters are a follow exchange"],
  p:["Ти підписуєшся на незнайомців і отримуєш бали, за бали незнайомці підписуються на тебе. Застосунок продає бали тим, хто не хоче чекати ($0,99–$254,99), і показує рекламу між завданнями. Головні скарги: «заплатив — не прийшло» і «за годину відписались».","Ты подписываешься на незнакомцев и получаешь баллы, за баллы незнакомцы подписываются на тебя. Приложение продаёт баллы тем, кто не хочет ждать ($0,99–$254,99), и показывает рекламу между заданиями. Главные жалобы: «заплатил — не пришло» и «через час отписались».","You follow strangers and earn points; strangers follow you for points. The app sells points to those who don’t want to wait ($0.99–$254.99) and shows ads between tasks. Top complaints: “paid, got nothing” and “they unfollowed within an hour”."]},
 {tag:"ok",go:"notes",h:["Безкоштовних TikTok-монеток не буває","Бесплатных TikTok-монет не бывает","There are no free TikTok coins"],
  p:["Правила TikTok забороняють будь-кому, крім TikTok, продавати чи передавати монетки. Такі застосунки нараховують власні бали, тримають їх «на утриманні» близько тижня, а вивести їх нікуди. Живуть лише з реклами: у Get Coins 10 рекламних мереж. У відгуках тут найчастіше пишуть «шахрайство»: 34 % негативних.","Правила TikTok запрещают кому-либо, кроме TikTok, продавать или передавать монеты. Такие приложения начисляют собственные баллы, держат их «на удержании» около недели, а вывести их некуда. Живут только за счёт рекламы: в Get Coins 10 рекламных сетей. В отзывах здесь чаще всего пишут «мошенничество»: 34 % негативных.","TikTok’s rules forbid anyone but TikTok from selling or transferring coins. These apps credit their own points, keep them “on hold” for about a week, and there is nowhere to withdraw them. They live on ads only: Get Coins carries 10 ad networks. Reviews here say “scam” more than anywhere else: 34% of negative ones."]},
 {tag:"ok",go:"system",h:["Обіцяне чесно віддають AI-інструменти","Обещанное честно отдают AI-инструменты","AI tools honestly deliver"],

 {tag:"ok",go:"notes",h:["TikTok сам платить за активність","TikTok сам платит за активность","TikTok itself pays for activity"],
  p:["У червні 2026 вийшов TikTok Pro · Events, у нього вже 10,6 млн встановлень. За перегляди й завдання там дають «зірки», які міняють на мерч, купони TikTok Shop або донати. Платформа сама займає нішу «нагорода за активність».","В июне 2026 вышел TikTok Pro · Events, у него уже 10,6 млн установок. За просмотры и задания там дают «звёзды», которые меняют на мерч, купоны TikTok Shop или донаты. Платформа сама занимает нишу «награда за активность».","TikTok Pro · Events launched in June 2026 and already has 10.6M installs. It gives “Stars” for watching and tasks, exchangeable for merch, TikTok Shop coupons or donations. The platform is taking the “reward for activity” niche itself."]},
 {tag:"guess",go:"us",us:true,h:["Що можемо ми","Что можем мы","What we can do"],

/* ── helpers ── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const t = k => { const v=T[k]; return v ? (v[L]!=null?v[L]:v[0]) : k; };
const tr = a => Array.isArray(a) ? (a[L]!=null?a[L]:a[0]) : a;
const fill = (s,o) => String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
const dec = x => L===2 ? String(x) : String(x).replace(".",",");
const pct = v => L===2 ? v+"%" : dec(v)+" %";
function fmtI(n){
  if(n==null) return "—";
  if(L===2){ if(n>=1e9) return (n/1e9).toFixed(1)+"B"; if(n>=1e6) return (n/1e6).toFixed(1)+"M"; if(n>=1e3) return Math.round(n/1e3)+"K"; return String(n); }
  const u = L===0 ? ["млрд","млн","тис."] : ["млрд","млн","тыс."];
  if(n>=1e9) return dec((n/1e9).toFixed(1))+" "+u[0];
  if(n>=1e6) return dec((n/1e6).toFixed(1))+" "+u[1];
  if(n>=1e3) return Math.round(n/1e3)+" "+u[2];
  return String(n);
}
const MON = [["січ.","лют.","бер.","квіт.","трав.","черв.","лип.","серп.","вер.","жовт.","лист.","груд."],null,["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]];
function fmtD(s){ if(!s) return "—"; const [y,m,d]=s.split("-"); return L===2 ? (+d)+" "+MON[2][+m-1]+" "+y : d+"."+m+"."+y; }
const play = p => "https://play.google.com/store/apps/details?id="+encodeURIComponent(p)+"&gl=US";
const icon = (a,cls) => a && a.ic ? '<img class="ico'+(cls?" "+cls:"")+'" src="'+a.ic+'" alt="" width="28" height="28" loading="lazy">' : '<span class="ico'+(cls?" "+cls:"")+'"></span>';
const byPkg = {}; APPS.forEach(a=>byPkg[a.p]=a);
const dirApps = d => APPS.filter(a=>a.c===d).sort((x,y)=>y.i-x.i);

/* direction aggregates */
const AGG = {};
Object.keys(DIRS).forEach(d=>{
  const list = APPS.filter(a=>a.c===d);
  let inst=0, r=0, r1=0;
  list.forEach(a=>{ inst+=a.i||0; if(a.r&&a.h1!=null){ r+=a.r; r1+=a.r*a.h1/100; } });
  AGG[d] = {n:list.length, inst, one: r? Math.round(1000*r1/r)/10 : 0, top: list.sort((x,y)=>y.i-x.i)[0]};
});

/* ── demand chart ── */
let metric = "inst", curDir = "followers";
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const m=v/p; const s=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10; return s*p; }
function renderDemand(){
  $("#dmetric").innerHTML = ["inst","cnt","one"].map(m=>'<button type="button" data-m="'+m+'" aria-pressed="'+(m===metric)+'">'+esc(t("m."+m))+'</button>').join("");
  $("#dtitle").textContent = t("dt."+metric);
  $("#dnote").textContent = t("dn."+metric);
  const val = d => metric==="inst"?AGG[d].inst:metric==="cnt"?AGG[d].n:AGG[d].one;
  const order = DORDER.slice().sort((a,b)=>val(b)-val(a));
  const max = metric==="one" ? 12 : niceMax(Math.max(...order.map(val)));
  const fmtV = v => metric==="inst"?fmtI(v):metric==="cnt"?String(v):pct(dec(v));
  const ref = metric==="one" ? 8.1 : null;
  $("#dbars").innerHTML = order.map(d=>{
    const v=val(d), w=Math.max(0.4,100*v/max);
    return '<button type="button" class="brow" data-d="'+d+'" aria-pressed="'+(d===curDir)+'"><span class="lab">'+esc(tr(DIRS[d].s))+'</span><span class="bplot"><i style="width:'+w+'%"></i>'+(ref!=null?'<span class="ref" style="left:'+(100*ref/max)+'%"></span>':'')+'</span><span class="val">'+esc(fmtV(v))+'</span></button>';
  }).join("");
  const fr = metric==="inst" ? [0,.5,1] : [0,.25,.5,.75,1];
  $("#dticks").innerHTML = fr.map(f=>{ const v=max*f; return '<span style="left:'+(f*100)+'%">'+esc(metric==="inst"?(v===0?"0":fmtI(v)):metric==="cnt"?String(Math.round(v*10)/10):pct(dec(Math.round(v*10)/10)))+'</span>'; }).join("");
  renderDirCard();
}
function renderDirCard(){
  const D=DIRS[curDir], A=AGG[curDir];
  const apps=dirApps(curDir);
  $("#dcard").innerHTML =
    '<div class="dir-head"><h3>'+esc(tr(D.n))+'</h3><span class="verd '+D.v+'">'+(D.v==="ok"?"✔ ":D.v==="bad"?"✗ ":"◐ ")+esc(t("v."+D.v))+'</span></div>'+
    '<p class="dir-stats">'+esc(fill(t("d.stats"),{n:A.n,i:fmtI(A.inst)}))+' · 1★ '+esc(pct(dec(A.one)))+'</p>'+
    '<dl class="dl">'+
      '<div><dt>'+esc(t("d.want"))+'</dt><dd>'+esc(tr(D.want))+'</dd></div>'+
      '<div><dt>'+esc(t("d.hook"))+'</dt><dd><span class="hooks">'+D.hook.map(h=>'<span class="hk">'+esc(h)+'</span>').join("")+'</span></dd></div>'+
      '<div><dt>'+esc(t("d.real"))+'</dt><dd>'+esc(tr(D.real))+'</dd></div>'+
      '<div><dt>'+esc(t("d.money"))+'</dt><dd class="dd-money"><span class="coin" aria-hidden="true">$</span><span>'+esc(tr(D.money))+'</span></dd></div>'+
      '<div><dt>'+esc(t("d.pain"))+'</dt><dd>'+esc(tr(D.pain))+'</dd></div>'+
      '<div><dt>'+esc(t("d.apps"))+'</dt><dd><ul class="alist">'+apps.map(a=>'<li>'+icon(a)+'<a href="'+play(a.p)+'" target="_blank" rel="noopener">'+esc(a.n)+'</a><span class="n">'+esc(fmtI(a.i))+'</span></li>').join("")+'</ul></dd></div>'+
    '</dl>';
}
function bindDemand(){
  $("#dmetric").addEventListener("click",e=>{ const b=e.target.closest("button[data-m]"); if(!b) return; metric=b.dataset.m; renderDemand(); });
  $("#dbars").addEventListener("click",e=>{ const b=e.target.closest(".brow"); if(!b) return; curDir=b.dataset.d; renderDemand(); });
  const tip=$("#dtip"), chart=$("#dchart");
  $("#dbars").addEventListener("mousemove",e=>{
    const b=e.target.closest(".brow"); if(!b){ tip.hidden=true; return; }
    const d=b.dataset.d, A=AGG[d];
    tip.innerHTML='<b>'+esc(tr(DIRS[d].n))+'</b><br>'+esc(fmtI(A.inst))+' · '+A.n+' '+esc(t("tip.apps"))+' · 1★ '+esc(pct(dec(A.one)))+'<br>'+esc(t("tip.top"))+': '+esc(A.top.n)+' ('+esc(fmtI(A.top.i))+')';
    tip.hidden=false;
    const r=chart.getBoundingClientRect();
    let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
    if(x+tip.offsetWidth>r.width-8) x=e.clientX-r.left-tip.offsetWidth-14;
    tip.style.left=Math.max(8,x)+"px"; tip.style.top=y+"px";
  });
  $("#dbars").addEventListener("mouseleave",()=>{ tip.hidden=true; });
}

/* ── simulation ── */
let simI=0, stepI=0;
function renderSim(){
  $("#simtabs").innerHTML = SIMS.map((s,i)=>'<button type="button" role="tab" aria-selected="'+(i===simI)+'" data-i="'+i+'">'+esc(s.app)+'</button>').join("");
  const S=SIMS[simI], st=S.steps[stepI], a=byPkg[S.pkg];
  const img=$("#shot"); img.src=SHOTS[st.img]||""; img.alt=S.app+" · "+tr(st.h);
  $("#pcount").textContent = fill(t("sys.step"),{i:stepI+1,n:S.steps.length});
  $("#prev").disabled = stepI===0; $("#next").disabled = stepI===S.steps.length-1;
  $("#panel").innerHTML =
    '<div class="ph">'+icon(a,"lg")+'<div><h3>'+esc(S.app)+'</h3><p class="meta">'+esc(tr(DIRS[S.d].n))+' · '+esc(fmtI(a?a.i:0))+(a&&a.s?' · ★ '+esc(dec(a.s)):'')+'</p></div></div>'+
    '<ol class="steps">'+S.steps.map((x,i)=>'<li><button type="button" class="step" data-s="'+i+'"'+(i===stepI?' aria-current="step"':'')+'><span class="no">'+(i+1)+'</span><span><b>'+esc(tr(x.h))+'</b><span class="mark '+x.mk+'">'+esc(t("mk."+x.mk))+'</span></span><p>'+esc(tr(x.p))+'</p></button></li>').join("")+'</ol>'+
    '<div><p class="k">'+esc(t("sys.res"))+'</p><dl class="kv">'+["price","access","ads","gives"].map(k=>'<div><dt>'+esc(t("k."+k))+'</dt><dd>'+esc(tr(S.kv[k]))+'</dd></div>').join("")+'</dl></div>';
}
function bindSim(){
  $("#simtabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; simI=+b.dataset.i; stepI=0; renderSim(); });
  $("#simtabs").addEventListener("keydown",e=>{ if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return; simI=(simI+(e.key==="ArrowRight"?1:SIMS.length-1))%SIMS.length; stepI=0; renderSim(); const b=$('#simtabs button[data-i="'+simI+'"]'); if(b) b.focus(); });
  $("#panel").addEventListener("click",e=>{ const b=e.target.closest(".step"); if(!b) return; stepI=+b.dataset.s; renderSim(); });
  $("#prev").addEventListener("click",()=>{ if(stepI>0){ stepI--; renderSim(); } });
  $("#next").addEventListener("click",()=>{ if(stepI<SIMS[simI].steps.length-1){ stepI++; renderSim(); } });
}
function renderFlow(){
  $("#flow").innerHTML = FLOW.map(f=>'<li'+(f.loss?' class="loss"':'')+'><b>'+esc(tr(f.b))+'</b><span>'+esc(tr(f.s))+'</span><span class="mark '+f.mk+'">'+esc(t("mk."+f.mk))+'</span></li>').join("");

  const n=+$("#want").value;

  $("#cfree").textContent = (L===2?(n*2).toLocaleString("en-US"):(n*2).toLocaleString("uk-UA").replace(/,/g," "));

}

function heatBg(v){ const k=Math.min(1,v/55); return "color-mix(in srgb, var(--risk) "+Math.round(k*72)+"%, var(--surface))"; }

  let h='<thead><tr><th scope="col" class="rh" style="font:500 11px/1.25 var(--f-mono);color:var(--muted)">'+esc(t("cmp.dir"))+'</th>'+THEMES.map(x=>'<th scope="col">'+esc(tr(x[1]))+'</th>').join("")+'</tr></thead><tbody>';

}
function bindHM(){

      '<td class="moneycell">'+(a.ads?'<span class="pill ad">'+esc(t("p.ads"))+'</span>':'')+esc(a.iap||"")+'</td>'+
      '<td class="num">'+esc(fmtD(a.upd))+'<br><small style="color:var(--muted)">'+esc(t("col.rel"))+' '+esc(fmtD(a.rel))+'</small></td>'+
      '<td>'+(a.th.length?a.th.map(x=>'<span class="pill th">'+esc(tr(THEMES.find(y=>y[0]===x)[1]))+'</span>').join(""):'<span style="color:var(--muted)">—</span>')+'</td></tr>';
  });
  $("#atable").innerHTML = h+'</tbody>';
  $("#shown").textContent = fill(t("apps.shown"),{n:rows.length,m:APPS.length});
}
function bindTable(){
  $("#fchips").addEventListener("click",e=>{ const b=e.target.closest("button[data-f]"); if(!b) return; fDir=b.dataset.f; renderTable(); });
  $("#atable").addEventListener("click",e=>{ const b=e.target.closest("th button[data-k]"); if(!b) return; const k=b.dataset.k; if(sortK===k) sortDir=-sortDir; else { sortK=k; sortDir=(k==="n")?1:-1; } renderTable(); });
  $("#q").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); renderTable(); });
}

/* ── money, notes, us, sources ── */
function renderRest(){
  $("#models").innerHTML = MODELS.map(m=>'<article class="model"><h3>'+esc(tr(m.h))+'</h3><span class="who">'+esc(tr(m.w))+'</span><p>'+esc(tr(m.p))+'</p><p class="rk">'+esc(tr(m.r))+'</p></article>').join("");
  $("#sdk").innerHTML = SDK.map(s=>{ const n=s[1].filter(x=>ADN.includes(x)).length; return '<div class="sdkrow"><b>'+esc(s[0])+'</b><span class="cnt" title="'+esc(t("sdk.n"))+'">'+n+'</span><ul class="sdk">'+s[1].map(x=>'<li'+(ADN.includes(x)?' class="adn"':'')+'>'+esc(x)+'</li>').join("")+'</ul></div>'; }).join("");
  $("#nlist").innerHTML = NOTES.map(n=>'<article class="nt"><h3>'+esc(tr(n.h))+'</h3>'+
    '<div class="nt-row"><span class="tag ok">✔</span><p><span class="lb">'+esc(t("n.fact"))+'</span>'+esc(tr(n.f))+'</p></div>'+
    '<div class="nt-row"><span class="tag guess">◌</span><p><span class="lb">'+esc(t("n.mean"))+'</span>'+esc(tr(n.m))+'</p></div>'+
    '<div class="nt-row"><span class="chk" aria-hidden="true">?</span><p><span class="lb">'+esc(t("n.check"))+'</span>'+esc(tr(n.c))+'</p></div></article>').join("");
  $("#lessons").innerHTML = LESSONS.map(l=>'<div class="ls"><b>'+esc(tr(l[0]))+'</b><p>'+esc(tr(l[1]))+'</p></div>').join("");
  $("#ideas").innerHTML = IDEAS.map(i=>'<article class="idea"><div class="idea-head"><h3>'+esc(tr(i.h))+'</h3><span class="lvl '+i.lvl+'">'+esc(t("lvl."+i.lvl))+'</span></div><dl class="dl">'+
    [["i.gets",i.g],["i.why",i.w],["i.money",i.m],["i.cost",i.c],["i.risk",i.r]].map(x=>'<div><dt>'+esc(t(x[0]))+'</dt><dd>'+esc(tr(x[1]))+'</dd></div>').join("")+'</dl></article>').join("");
  $("#nope").innerHTML = NOPE.map(n=>'<li>'+tr(n)+'</li>').join("");
  $("#method").innerHTML = METHOD.map(m=>'<li>'+esc(tr(m))+'</li>').join("");
  $("#changes").innerHTML = CHANGES.map(m=>'<li>'+esc(tr(m))+'</li>').join("");
  $("#sources").innerHTML = SOURCES.map(s=>'<li><a href="'+s[0]+'" target="_blank" rel="noopener">'+esc(tr(s[1]))+'</a><small>'+esc(tr(s[2]))+'</small></li>').join("");
}

/* ── language ── */
function renderAll(){ applyStatic(); renderSum(); renderDemand(); renderHooks(); renderSim(); renderFlow(); renderHM(); renderTable(); renderRest(); }
function setLang(code, save){
  const i=LANGS.indexOf(code); if(i<0) return; L=i; renderAll();
  if(save){ try{ localStorage.setItem("tt-lang",code); }catch(e){} }
}
document.querySelector(".langs").addEventListener("click",e=>{ const b=e.target.closest("button[data-lang]"); if(b) setLang(b.dataset.lang,true); });
$("#want").addEventListener("input",calc);
bindDemand(); bindSim(); bindHM(); bindTable();
let start="uk";
const hsh=(location.hash||"").slice(1);
if(LANGS.includes(hsh)) start=hsh; else { try{ const s=localStorage.getItem("tt-lang"); if(LANGS.includes(s)) start=s; }catch(e){} }
setLang(start,false);
window.addEventListener("hashchange",()=>{ const x=(location.hash||"").slice(1); if(LANGS.includes(x)) setLang(x,true); });
})();
</script>
