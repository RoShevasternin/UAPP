<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Жива версія: https://claude.ai/artifact/CPjEDiKFgmF2cdMFouV4z7 · Версія 2 (симуляція як у SMS-звіті), 02.10.2026. Правиш артефакт — перезбережи й цей файл. -->
<title>Стрімінги за рекламу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: як у SMS-звіті — липка панель VELDAN з мовами, «сцена» з симульованим телефоном поруч із поясненнями, далі звітні блоки.
   Жовтий = реклама і гроші, бірюзовий = дії людини, червоний = правила Play і захоплення екрана. */
:root{
  --paper:#F2F3F5; --surface:#FFFFFF; --ink:#141722; --ink-2:#4A5064; --muted:#6B7184; --line:#DADDE3; --grid:#E7E9ED;
  --ad:#F2BF0A; --ad-ink:#241C00; --ad-soft:#FFF3C4;
  --user:#0E7A62; --user-ink:#FFFFFF;
  --risk:#B3372B; --risk-soft:#FBE8E5; --on-risk:#FFFFFF;
  --bar:#BCC1CC; --bar-em:#141722;
  --screen:#FFFFFF; --screen-2:#F1F2F5; --screen-ink:#15171F; --screen-muted:#686E80; --screen-line:#E3E5EA; --dlg:#FFFFFF;
  --bezel:#1A1C22; --scrim:rgba(12,14,20,.45);
  /* сталі кольори симуляції: чати, іконки та вигадані рекламні креативи однакові в обох темах */
  --c1:#3F6FD6; --c2:#C4507A; --c3:#2E9468; --c4:#B06E14; --c5:#7657C4; --on-c:#FFFFFF;
  --icon-a:#2F66E0; --icon-b:#15945A; --on-icon:#FFFFFF;
  --cr1:#152259; --cr1-a:#6CD0FF; --cr1-b:#FFCC48; --cr2:#0D5642; --cr2-a:#7BE0B5; --cr3:#3B1E57; --cr3-a:#C9A8FF;
  --cr-ink:#FFFFFF; --cr-track:rgba(255,255,255,.22); --cr-close:rgba(255,255,255,.16);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1015; --surface:#161920; --ink:#E8EAF0; --ink-2:#B0B5C3; --muted:#8B91A2; --line:#2A2E39; --grid:#21252E;
    --ad-soft:#3A3211; --user:#3DB396; --user-ink:#05231B; --risk:#FF7A6A; --risk-soft:#3B1D1A; --on-risk:#2A0D09;
    --bar:#4A5060; --bar-em:#E8EAF0;
    --screen:#0B0C10; --screen-2:#1B1D24; --screen-ink:#ECEEF3; --screen-muted:#9095A5; --screen-line:#272A33; --dlg:#22252D;
    --bezel:#000000; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1015; --surface:#161920; --ink:#E8EAF0; --ink-2:#B0B5C3; --muted:#8B91A2; --line:#2A2E39; --grid:#21252E;
  --ad-soft:#3A3211; --user:#3DB396; --user-ink:#05231B; --risk:#FF7A6A; --risk-soft:#3B1D1A; --on-risk:#2A0D09;
  --bar:#4A5060; --bar-em:#E8EAF0;
  --screen:#0B0C10; --screen-2:#1B1D24; --screen-ink:#ECEEF3; --screen-muted:#9095A5; --screen-line:#272A33; --dlg:#22252D;
  --bezel:#000000; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);margin:0}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
section{scroll-margin-top:64px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.k{font:500 11.5px/1.35 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2{font:500 clamp(22px,3.2vw,32px)/1.15 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h3,h4{text-wrap:balance}

/* ── top bar ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.bar-left{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font:700 15px/1 var(--f-display);letter-spacing:.22em;color:var(--ink);white-space:nowrap}
.bar-k{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;border-left:1px solid var(--line)}
@media (max-width:520px){.bar-k{display:none}}
.langs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:none}
.langs button{appearance:none;border:0;background:none;color:var(--ink-2);font:600 12px/1 var(--f-mono);letter-spacing:.06em;padding:8px 10px;border-radius:7px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ── header ── */
.top{padding-block:clamp(28px,6vw,68px) clamp(28px,4vw,44px)}
h1{font:700 clamp(30px,5.6vw,58px)/1.05 var(--f-display);letter-spacing:-.025em;margin:14px 0 18px;max-width:18ch;text-wrap:balance}
.lede{font-size:clamp(17px,2.1vw,20px);line-height:1.5;color:var(--ink-2);max-width:62ch;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font:600 12px/1 var(--f-mono);flex:none}
.tag.ok{background:var(--ink);color:var(--paper)}
.tag.guess{border:1.5px dashed var(--muted);color:var(--ink-2)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.toc a{font-size:14px;text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);background:var(--surface)}
.toc a:hover{border-color:var(--ink-2);color:var(--ink)}

/* ── stage ── */
.stage{background:var(--surface);border-block:1px solid var(--line);padding-block:clamp(28px,5vw,52px)}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 28px}
.stage-head p{margin:8px 0 0;color:var(--ink-2);max-width:58ch}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:100%}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:500 14px/1.25 var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;text-align:left}
.tab b{font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.stage-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(24px,4.5vw,64px);margin-top:30px;align-items:start}
@media (max-width:840px){.stage-grid{grid-template-columns:minmax(0,1fr)}}
.device{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.sim-note{font-size:12.5px;color:var(--muted);text-align:center;margin:0;max-width:300px}

/* phone */
.phone{width:300px;max-width:100%;aspect-ratio:300/630;background:var(--bezel);border-radius:46px;padding:9px;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(8,10,16,.5)}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--screen);color:var(--screen-ink);font:400 13.5px/1.4 var(--f-ui);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.sb{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 24px 8px;font:600 12px/1 var(--f-ui);position:relative;z-index:5}
.sb .cam{position:absolute;left:50%;top:9px;width:13px;height:13px;border-radius:50%;background:var(--bezel);transform:translateX(-50%)}
.sb .sys{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:1.5px;align-items:flex-end;height:10px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.bat{width:21px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px;position:relative}
.bat::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.bat i{display:block;height:100%;width:72%;background:currentColor;border-radius:1px}
.sc{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.gesture{flex:none;height:18px;display:flex;align-items:center;justify-content:center;position:relative;z-index:9}
.gesture i{width:108px;height:4px;border-radius:2px;background:var(--screen-ink);opacity:.45}
.gesture.has-btn{height:40px}
.homebtn{appearance:none;border:0;cursor:pointer;background:var(--screen-ink);color:var(--screen);font:700 12px/1 var(--f-ui);letter-spacing:.02em;padding:8px 22px;border-radius:999px;display:flex;align-items:center;gap:6px}
.homebtn svg{width:14px;height:14px}
.ic{width:22px;height:22px;flex:none}
.pbtn{appearance:none;border:0;cursor:pointer;font:600 14px/1 var(--f-ui);border-radius:999px;padding:13px 18px}
.pbtn.primary{background:var(--user);color:var(--user-ink)}
.pbtn.quiet{background:var(--screen-2);color:var(--screen-ink)}
.pbtn.wide{width:100%}
.iconbtn{appearance:none;border:0;background:none;color:inherit;padding:5px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--user) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;outline:2px solid var(--user);outline-offset:3px}}
.app-icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--on-icon);flex:none}
.app-icon.a{background:var(--icon-a)} .app-icon.b{background:var(--icon-b)}
.app-icon svg{width:62%;height:62%}
.app-icon.sm{width:44px;height:44px;border-radius:14px}
.app-icon.xs{width:22px;height:22px;border-radius:7px}
.app-icon.big{width:76px;height:76px;border-radius:22px}

/* store */
.st{padding:4px 16px 0;display:flex;flex-direction:column;gap:13px;overflow:hidden}
.st-search{display:flex;align-items:center;gap:10px;background:var(--screen-2);border-radius:999px;padding:9px 14px;color:var(--screen-muted);font-size:13px}
.st-search b{color:var(--screen-ink);font-weight:500;flex:1}
.st-app{display:flex;gap:12px;align-items:center}
.st-name{font-weight:600;font-size:15px;line-height:1.25}
.st-dev{color:var(--user);font-size:12.5px;margin-top:2px}
.st-flags{color:var(--screen-muted);font-size:11.5px;margin-top:2px}
.st-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;border-block:1px solid var(--screen-line);padding-block:8px}
.st-stats div{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--screen-muted);padding-inline:4px}
.st-stats b{font-size:13px;color:var(--screen-ink);font-weight:600}
.st-stats div+div{border-left:1px solid var(--screen-line)}
.st-shots{display:flex;gap:8px}
.st-shots i{flex:1;height:118px;border-radius:10px;background:var(--screen-2)}
.st-about{font-size:12px;color:var(--screen-muted);margin:0}
.inst{display:grid;gap:8px}
.inst-row{display:flex;justify-content:space-between;font-size:12px;color:var(--screen-muted)}
.pbar{height:6px;border-radius:3px;background:var(--screen-2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--user);border-radius:3px;transition:width .12s linear}
.st-row{display:flex;gap:10px}

/* dialogs */
.splash{flex:1;display:grid;place-items:center;align-content:center;gap:12px;color:var(--screen-muted);font-size:14px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:6}
.dlg{position:absolute;left:12px;right:12px;bottom:26px;z-index:7;background:var(--dlg);color:var(--screen-ink);border-radius:26px;padding:20px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.dlg-title{font-size:16px;font-weight:600;line-height:1.3;margin:0}
.dlg-body{font-size:12.5px;color:var(--screen-muted);margin:0}
.dlg-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.dlg-actions button{appearance:none;border:0;background:none;color:var(--user);font:600 14px/1 var(--f-ui);padding:11px 13px;border-radius:999px;cursor:pointer}
.dlg-actions button.strong{background:var(--user);color:var(--user-ink)}
.dlg-actions button.danger{background:var(--risk);color:var(--on-risk)}

/* chats & thread */
.abar{display:flex;align-items:center;gap:10px;padding:4px 12px 10px 14px;flex:none}
.abar .t{font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar .ic{color:var(--screen-muted)}
.segs{display:flex;gap:6px;padding:0 14px 8px;flex:none}
.segs span{font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--screen-2);color:var(--screen-muted)}
.segs span.on{background:var(--screen-ink);color:var(--screen)}
.l-searchbar{margin:0 14px 8px;background:var(--screen-2);border-radius:999px;padding:9px 14px;color:var(--screen-muted);font-size:13px;display:flex;gap:8px;align-items:center}
.chats{list-style:none;margin:0;padding:0;overflow:hidden}
.chat{appearance:none;border:0;background:none;color:inherit;width:100%;display:flex;align-items:center;gap:11px;padding:9px 14px;text-align:left;cursor:pointer;font:inherit;position:relative}
.chat:hover{background:var(--screen-2)}
.chat.cue{background:color-mix(in srgb,var(--user) 12%,transparent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-c);font-weight:600;flex:none;background:var(--c,var(--c1))}
.av.sm{width:30px;height:30px;font-size:13px}
.cm{flex:1;min-width:0;display:flex;flex-direction:column}
.cn{font-weight:600;font-size:14px}
.cl{color:var(--screen-muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11px;color:var(--screen-muted);align-self:flex-start;margin-top:3px}
.unread .cl{color:var(--screen-ink);font-weight:500}
.strip{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.tap{align-self:center;font:600 10.5px/1 var(--f-mono);background:var(--user);color:var(--user-ink);padding:5px 8px;border-radius:999px}
.fab{position:absolute;right:16px;bottom:12px;width:48px;height:48px;border-radius:16px;background:var(--screen-2);display:grid;place-items:center;font-size:24px;color:var(--screen-ink)}
.thread{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px;overflow:hidden;background:color-mix(in srgb,var(--c,var(--screen-2)) 14%,var(--screen));justify-content:flex-end}
.date-chip{align-self:center;font-size:10.5px;color:var(--screen-muted);background:var(--screen);padding:3px 10px;border-radius:999px;margin-bottom:auto}
.msg{max-width:80%;padding:8px 12px;border-radius:18px;font-size:13.5px;line-height:1.35}
.msg time{display:block;font-size:10.5px;opacity:.75;margin-top:3px}
.msg.in{background:var(--screen);color:var(--screen-ink);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 0 0 1px var(--screen-line)}
.msg.out{background:var(--c,var(--user));color:var(--on-c);border-bottom-right-radius:6px;align-self:flex-end}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px 6px;flex:none}
.composer .field{flex:1;min-width:0;background:var(--screen-2);border-radius:999px;padding:10px 14px;font-size:13.5px}
.composer .field.ph{color:var(--screen-muted)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--user);color:var(--user-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:18px;height:18px}
.send[disabled]{opacity:.4;cursor:default}

/* ad overlay */
.ad{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;background:var(--crbg);color:var(--cr-ink)}
.ad-top{display:flex;align-items:center;justify-content:space-between;padding:40px 16px 8px}
.ad-badge{background:var(--ad);color:var(--ad-ink);font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:5px;justify-self:start}
.ad-timer{position:relative;width:34px;height:34px;display:grid;place-items:center;font:600 13px/1 var(--f-mono)}
.ad-timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ad-timer circle{fill:none;stroke-width:3}
.ad-timer .trk{stroke:var(--cr-track)}
.ad-timer .val{stroke:var(--ad);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ad-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--cr-close);color:var(--cr-ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ad-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:10px 24px;min-height:0}
.ad-title{font:700 22px/1.12 var(--f-display);letter-spacing:-.01em;margin:0}
.ad-sub{font-size:13.5px;opacity:.85;margin:0}
.ad-cta{margin:0 22px 10px;background:var(--ad);color:var(--ad-ink);text-align:center;font-weight:600;padding:13px;border-radius:999px}
.ad-foot{text-align:center;font-size:11.5px;opacity:.8;margin:0 0 12px}
.gems{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.gems i{width:34px;height:34px;transform:rotate(45deg);border-radius:7px;background:var(--cr1-a)}
.gems i.big{width:52px;height:52px;background:var(--cr1-b)}
.gauge{width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--cr2-a) 0 82%,var(--cr-track) 82% 100%);display:grid;place-items:center;margin-bottom:8px}
.gauge i{width:96px;height:96px;border-radius:50%;background:var(--cr2);display:grid;place-items:center;font:700 22px/1 var(--f-display);font-style:normal}
.shield{width:86px;height:100px;background:var(--cr3-a);clip-path:polygon(50% 0,100% 15%,100% 55%,50% 100%,0 55%,0 15%);margin-bottom:8px}

/* launcher and the takeover */
.launcher{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 16px 8px;gap:11px;background:var(--screen)}
.launcher.tint{background:color-mix(in srgb,var(--icon-b) 18%,var(--screen))}
.stack{position:relative;flex:1;min-height:0}
.stack > .launcher{position:absolute;inset:0}
.wipe{animation:wipe .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.wipe{animation:none}}
.state-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px 5px 6px;border-radius:999px;max-width:100%}
.state-chip.before{background:var(--screen-2);color:var(--screen-ink);box-shadow:0 0 0 1px var(--screen-line);padding-left:10px}
.state-chip.after{background:var(--risk);color:var(--on-risk)}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--risk);color:var(--on-risk);font:700 10.5px/1 var(--f-mono);flex:none;vertical-align:-3px}
.state-chip.after .mk{background:var(--on-risk);color:var(--risk)}
.facts .mk{margin-right:4px}
.l-clock{font:500 44px/1 var(--f-display);letter-spacing:-.03em;margin-top:2px}
.l-date{font-size:12.5px;color:var(--screen-muted);margin-top:-6px}
.l-search{background:var(--screen);border-radius:999px;padding:10px 14px;color:var(--screen-muted);font-size:13px;box-shadow:0 0 0 1px var(--screen-line);display:flex;gap:8px;align-items:center}
.l-ad{position:relative;background:var(--ad-soft);border:1px solid color-mix(in srgb,var(--ad) 60%,transparent);border-radius:18px;padding:12px 14px;display:grid;gap:4px;justify-items:start}
.l-ad b{font-size:14.5px}
.l-ad span{font-size:12px;color:var(--screen-muted)}
.l-ad .mk{position:absolute;top:-7px;right:-5px;box-shadow:0 0 0 2px var(--screen)}
.l-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;margin-top:auto}
.lic{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--screen-ink);text-align:center;min-width:0}
.lic > i{width:44px;height:44px;border-radius:14px;background:var(--screen-2);display:grid;place-items:center;box-shadow:0 0 0 1px var(--screen-line);color:var(--screen-ink)}
.tint .lic > i{background:var(--screen)}
.lic svg{width:22px;height:22px}
.lic span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-swipe{appearance:none;border:0;cursor:pointer;align-self:flex-end;display:flex;align-items:center;gap:6px;background:var(--user);color:var(--user-ink);font:600 12.5px/1 var(--f-ui);padding:8px 13px 8px 8px;border-radius:999px}
.l-swipe .mk{box-shadow:0 0 0 2px var(--user-ink)}

/* after-call, settings, paywall, toast */
.call{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 18px 12px;background:var(--screen-2)}
.call-k{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--screen-muted)}
.call .av{width:72px;height:72px;font-size:26px;margin-top:12px}
.call-name{font-size:20px;font-weight:600}
.call-meta{font-size:12.5px;color:var(--screen-muted)}
.call-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:18px}
.call-acts span{background:var(--screen);border-radius:14px;padding:12px 4px;text-align:center;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.call-acts svg{width:20px;height:20px}
.call-app{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--screen-muted);margin-bottom:10px}
.crumbs{font-size:11.5px;color:var(--screen-muted);padding:0 16px 10px;margin:0}
.radios{list-style:none;margin:0;padding:0 8px}
.radio{appearance:none;border:0;background:none;color:inherit;font:inherit;width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;cursor:pointer;text-align:left}
.radio:hover{background:var(--screen-2)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--screen-muted);display:grid;place-items:center;flex:none}
.radio.on .rd{border-color:var(--user)}
.radio.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--user)}
.radio small{display:block;color:var(--screen-muted);font-size:11.5px}
.pw{flex:1;display:flex;flex-direction:column;gap:12px;padding:0 18px 12px;position:relative}
.pw-x{align-self:flex-start;font-size:22px;width:34px;height:34px;color:var(--screen-muted)}
.pw-hero{background:var(--ad-soft);border-radius:22px;padding:18px;display:grid;gap:6px}
.pw-hero .k2{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em}
.pw-hero h4{font:700 22px/1.1 var(--f-display);margin:0}
.pw-hero span:last-child{font-size:12.5px;color:var(--screen-muted)}
.pw ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.pw li{display:flex;gap:8px;align-items:flex-start}
.pw li::before{content:"✓";color:var(--user);font-weight:700}
.pw-plan{border:2px solid var(--user);border-radius:16px;padding:12px 14px;display:grid;gap:2px;margin-top:auto}
.pw-plan b{font-size:15px}
.pw-plan span{font-size:12.5px;color:var(--screen-muted)}
.pw-fine{text-align:center;font-size:11px;color:var(--screen-muted);margin:0}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--screen-ink);color:var(--screen);font:500 12.5px/1.35 var(--f-ui);padding:9px 14px;border-radius:12px;z-index:20;width:max-content;max-width:85%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* meters */
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:300px;max-width:100%}
.meter{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:background .3s}
.meter b{display:block;font:600 22px/1.1 var(--f-body)}
.meter span{font-size:12px;color:var(--ink-2);line-height:1.3;display:block;margin-top:3px}
.meter.hot{background:var(--ad-soft);border-color:var(--ad)}
.meters-cap{font-size:12px;color:var(--muted);width:300px;max-width:100%;margin:0}

/* panel */
.panel{min-width:0;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:4px}
.steps button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}
.steps button.done{background:var(--ink-2)}
.steps button.cur{background:var(--ink)}
.steps button:hover{background:var(--muted)}
.step-no{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0}
.step-title{font:500 clamp(20px,2.6vw,26px)/1.2 var(--f-display);letter-spacing:-.01em;margin:0}
.step-lead{margin:0;font-size:16.5px;max-width:62ch}
.hint{margin:0;font-size:14px;color:var(--ink-2);display:flex;gap:9px;align-items:baseline}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--user);flex:none;transform:translateY(-1px)}
.cmp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.cmp button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:8px;cursor:pointer}
.cmp button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{border-radius:12px;padding:12px 16px}
.note p{margin:0}
.note .k{color:var(--ink);display:flex;align-items:center;gap:8px}
.note .k::before{content:"";width:9px;height:9px;border-radius:2px;flex:none}
.money{background:var(--ad-soft)}
.money .k::before{background:var(--ad)}
.policy{background:var(--risk-soft)}
.policy .k::before{background:var(--risk)}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.facts li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.facts .tag{margin-top:1px}
.quote{margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;display:grid;gap:8px;background:var(--paper)}
.quote blockquote{margin:0;font-size:14.5px;line-height:1.5}
.quote .tr{margin:0;font-size:14.5px;color:var(--ink-2)}
.quote figcaption{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.snav{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1 var(--f-body);padding:11px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}

/* ── report blocks ── */
.block{padding-block:clamp(40px,6vw,72px);border-bottom:1px solid var(--line)}
.block-head{display:grid;gap:10px;margin-bottom:28px;max-width:70ch}
.block-head p{margin:0;color:var(--ink-2)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:20px}
.appcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,24px);display:grid;gap:18px;min-width:0;align-content:start}
.ac-head{display:flex;gap:14px;align-items:center}
.ac-head .app-icon{width:52px;height:52px}
.ac-name{font:600 18px/1.25 var(--f-body);margin:4px 0 0}
.ac-pitch{margin:0;color:var(--ink-2);font-size:15px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}}
.hist{display:grid;gap:6px}
.hist-title{font-size:14px;font-weight:600;margin:0 0 4px}
.hrow{display:grid;grid-template-columns:2.6em minmax(0,1fr) 4em;gap:10px;align-items:center;font-size:13px}
.hrow .lab{color:var(--ink-2);font-variant-numeric:tabular-nums}
.hrow .val{text-align:right;font-variant-numeric:tabular-nums}
.htrack{height:10px;position:relative}
.htrack i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-em);border-radius:0 4px 4px 0;min-width:2px}
.ac-link{justify-self:start;font-weight:500}
.themes{display:grid;gap:36px}
.theme h3{font:600 19px/1.3 var(--f-body);margin:0 0 4px}
.theme > p{margin:0 0 14px;color:var(--ink-2);max-width:70ch}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0;margin:0}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.chip{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;background:var(--ink);color:var(--paper)}
.chip.dev{background:var(--ad);color:var(--ad-ink)}
.stars{color:var(--ink);letter-spacing:1px}
.qcard blockquote{margin:0;font-size:14.5px;line-height:1.5}
.qcard .tr{margin:0;font-size:14.5px;color:var(--ink-2)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,22px);min-width:0;position:relative;margin:0}
.chart h3{font:600 16px/1.35 var(--f-body);margin:0}
.chart .sub{margin:4px 0 16px;font-size:13.5px;color:var(--ink-2)}
.brow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13.5px;padding:4px 6px;margin-inline:-6px;border-radius:6px;cursor:default}
.brow:hover,.brow:focus-visible{background:var(--paper)}
.brow .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.brow.em .lab{color:var(--ink);font-weight:600}
.bplot{height:12px;position:relative;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:25% 100%;box-shadow:inset -1px 0 0 var(--grid)}
.bplot i{position:absolute;left:0;top:1px;bottom:1px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.brow.em .bplot i{background:var(--bar-em)}
.brow .val{text-align:right;font-variant-numeric:tabular-nums}
.brow.em .val{font-weight:600}
.axis{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.6em;gap:10px;font:500 11px/1 var(--f-mono);color:var(--muted);margin-top:8px}
.ticks{position:relative;height:12px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:260px;z-index:3}
details.tbl{margin-top:18px}
details.tbl summary{cursor:pointer;font-weight:500;padding:6px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.em td{font-weight:600}
.verdict{background:var(--surface);border:1.5px solid var(--ink);border-radius:18px;padding:clamp(18px,3vw,26px);display:grid;gap:10px;margin-top:28px;max-width:80ch}
.verdict h3{font:500 clamp(19px,2.4vw,23px)/1.25 var(--f-display);margin:0}
.verdict p{margin:0}
.odd{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;margin-top:36px}
@media (max-width:900px){.odd{grid-template-columns:minmax(0,1fr)}}
.odd h3{font:600 18px/1.3 var(--f-body);margin:0 0 6px}
.odd > div > p{margin:0 0 12px;color:var(--ink-2)}
.odd td.txt{min-width:16em}
.plain{margin:0;padding-left:1.1em;display:grid;gap:10px}
.tl{list-style:none;margin:0;padding:0;max-width:780px}
.tl li{display:grid;grid-template-columns:6.8em 22px minmax(0,1fr);gap:12px;align-items:start;padding-bottom:20px;position:relative}
.tl li::before{content:"";position:absolute;left:calc(6.8em + 12px + 10px);top:8px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl time{font:500 13px/1.6 var(--f-mono);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.tl .dot{width:14px;height:14px;border-radius:50%;margin:4px auto 0;position:relative;z-index:1}
.tl .ev .dot{background:var(--ink)}
.tl .rv .dot{background:var(--paper);border:2px solid var(--ink-2)}
.tl p{margin:0}
.tl .src{display:block;font-size:13px;color:var(--muted)}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink-2);margin:0 0 18px;padding:0;list-style:none}
.tl-legend li{display:flex;gap:8px;align-items:center}
.tl-legend i{width:12px;height:12px;border-radius:50%}
.tl-legend .e{background:var(--ink)}
.tl-legend .r{border:2px solid var(--ink-2)}
@media (max-width:520px){.tl li{grid-template-columns:5.8em 18px minmax(0,1fr);gap:10px}.tl li::before{left:calc(5.8em + 10px + 8px)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
.card h3{font:600 16.5px/1.3 var(--f-body);margin:0;display:flex;gap:9px;align-items:center}
.card p{margin:0;font-size:14.5px;color:var(--ink-2)}
.model{list-style:none;counter-reset:m;margin:0;padding:0;max-width:840px}
.model > li{counter-increment:m;display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.model > li::before{content:counter(m,decimal-leading-zero);font:500 14px/1.65 var(--f-mono);color:var(--muted)}
.model h3{font:600 17px/1.35 var(--f-body);margin:0 0 4px}
.model p{margin:0;color:var(--ink-2)}
.sdk-group{display:grid;gap:6px;margin-top:12px}
.sdk-group b{font-size:13.5px}
.sdk{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.sdk li{font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.rules{display:grid;gap:12px;margin-top:30px;max-width:840px}
.rules > h3{font:600 18px/1.3 var(--f-body);margin:0}
.rule{background:var(--risk-soft);border-radius:14px;padding:16px 18px;display:grid;gap:6px;margin:0}
.rule blockquote{margin:0;font-size:14.5px}
.rule figcaption{font-size:14.5px;color:var(--ink-2)}
.us{display:grid;gap:12px;max-width:840px;margin:0;padding:0;list-style:none}
.us li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.us b{display:block;margin-bottom:4px}
.sources{columns:2 330px;column-gap:40px;margin:0;padding:0;list-style:none}
.sources li{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--grid);font-size:14.5px}
.sources small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.nt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,22px);display:grid;gap:12px;align-content:start;min-width:0}
.nt .k{margin:0}
.nt h3{font:600 17.5px/1.3 var(--f-body);margin:0}
.nt-row{display:flex;gap:10px;align-items:flex-start}
.nt-row p{margin:0;font-size:15px}
.nt-row .tag{margin-top:1px}
.nt-check{margin:0;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px}
footer{padding-block:28px 56px;color:var(--muted);font-size:13px}
footer p{margin:0;max-width:80ch}
/* streaming v2 additions */
.answer{margin-top:26px;background:var(--surface);border:1.5px solid var(--ink);border-radius:18px;padding:18px 22px;max-width:86ch}
.answer .k{margin:0 0 8px}
.answer ul{margin:0;padding-left:1.1em;display:grid;gap:8px;font-size:16px}
.apps.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.ac-name a{text-decoration:none}.ac-name a:hover{text-decoration:underline}
.ico{width:28px;height:28px;border-radius:7px;background:var(--grid);display:block;object-fit:cover;flex:none}
.ico.lg{width:48px;height:48px;border-radius:12px}
.ico.xs2{width:24px;height:24px;border-radius:6px}
.ico.st-ic{width:56px;height:56px;border-radius:14px}
.lbl{font:500 11.5px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:block}
.sub-h{font:600 18px/1.3 var(--f-body);margin:34px 0 12px}
/* money flow */
.flow3{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.f3{flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.f3 b{font-size:15px}.f3 span{font-size:13.5px;color:var(--ink-2)}
.f3.money{background:var(--ad-soft);border-color:color-mix(in srgb,var(--ad) 55%,transparent)}
.f3.loss{background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 35%,transparent)}
.arr{align-self:center;color:var(--muted);font-size:18px}
@media (max-width:700px){.arr{display:none}}
.appcell{display:flex;gap:10px;align-items:center}
/* calc */
.cgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,3vw,32px);align-items:start}
@media (max-width:860px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,22px);display:grid;gap:14px}
.calc small{color:var(--muted);font-size:13px}
.segs2{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.segs2 button{appearance:none;border:0;background:none;color:var(--ink-2);font:600 14px/1 var(--f-mono);padding:9px 13px;border-radius:9px;cursor:pointer}
.segs2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 4.2em;gap:12px;align-items:center}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) 4em}.crow input{grid-column:1/-1;grid-row:2}}
.crow label{font-size:14.5px;font-weight:500}
.crow input[type=range]{width:100%;accent-color:var(--ink)}
.crow output{font:600 15px/1 var(--f-mono);text-align:right}
.cout{display:grid;gap:12px}

"hdr.h1":["Обіцяють Netflix, показують рекламу","Обещают Netflix, показывают рекламу","They promise Netflix and show ads"],
"hdr.lede":["Як працюють застосунки, що обіцяють безкоштовні підписки, картки й гроші за ігри та рекламу, і чому люди пишуть «обіцяють і не дають». Симуляція трьох застосунків з найгіршими відгуками, цифри з Google Play і розбір того, звідки в них гроші.","Как работают приложения, обещающие бесплатные подписки, карты и деньги за игры и рекламу, и почему люди пишут «обещают и не дают». Симуляция трёх приложений с худшими отзывами, цифры из Google Play и разбор того, откуда у них деньги.","How apps that promise free subscriptions, gift cards and cash for games and ads work, and why users say “they promise and don’t pay”. A walkthrough of the three worst-reviewed apps, Google Play numbers and where their money comes from."],

"demo.p":["Натискайте кнопки на екрані телефона або «Далі». Праворуч видно, що відбувається на кожному кроці і де тут гроші. Лічильники під телефоном показують, скільки реклами людина вже подивилась і скільки отримала.","Нажимайте кнопки на экране телефона или «Далее». Справа видно, что происходит на каждом шаге и где здесь деньги. Счётчики под телефоном показывают, сколько рекламы человек уже посмотрел и сколько получил.","Tap the buttons on the phone or “Next”. On the right: what happens at each step and where the money is. The counters under the phone show how many ads the person has watched and what they have received."],

"model.p":["У всіх трьох одна схема: гроші платять рекламодавці й рекламні мережі, а людина отримує внутрішні бали. Між балами й реальною нагородою стоїть курс, поріг і перевірка.","У всех трёх одна схема: деньги платят рекламодатели и рекламные сети, а человек получает внутренние баллы. Между баллами и реальной наградой стоят курс, порог и проверка.","All three share one scheme: advertisers and ad networks pay the app, and the user gets in-app points. Between points and a real reward sit an exchange rate, a threshold and a verification step."],

"calc.real":["А ось як рахує mRewards: картка Google Play на $10 коштує 78 000 монет (їхній скрін у Play), а за відео дають 2 монети (відгук 19.08.2026). Це 39 000 відео, або приблизно 325 годин реклами.","А вот как считает mRewards: карта Google Play на $10 стоит 78 000 монет (их скрин в Play), а за видео дают 2 монеты (отзыв 19.08.2026). Это 39 000 видео, или примерно 325 часов рекламы.","Here’s mRewards’s math: a $10 Google Play card costs 78,000 coins (their Play screenshot), and a video pays 2 coins (review, 19 Aug 2026). That’s 39,000 videos, about 325 hours of ads."],

   l:["Ті, хто таки назбирав на мінімальний код, бачать «48 годин». Потім 48 годин минають, а код не приходить.","Те, кто всё-таки накопил на минимальный код, видят «48 часов». Потом 48 часов проходят, а код не приходит.","Those who do save up for the smallest code see “48 hours”. Then 48 hours pass and the code doesn’t come."],
   h:["натисніть на заявку","нажмите на заявку","tap the request"],
   mo:["Що довше виплата «в обробці», то довше людина грає й дивиться рекламу далі.","Чем дольше выплата «в обработке», тем дольше человек играет и смотрит рекламу дальше.","The longer a payout is “processing”, the longer the user keeps playing and watching ads."],
   f:[["ok",["Відгуки 27.09.2026 і 20.06.2026: «48 hour time… expanded but it will not given me money», «applied for a redeem code 10 days ago».","Отзывы 27.09.2026 и 20.06.2026: «48 hour time… expanded but it will not given me money», «applied for a redeem code 10 days ago».","Reviews, 27 Sep 2026 and 20 Jun 2026: “48 hour time… expanded but it will not given me money”, “applied for a redeem code 10 days ago”."]],["ok",["Відгук 23.08.2026, переклад Тараса: «Через шість місяців досі не можу вивести винагороду».","Отзыв 23.08.2026, перевод Тараса: «Через шесть месяцев до сих пор не могу вывести награду».","Review, 23 Aug 2026 (via Taras): “6 MONTHS LATER STILL CANT CASHOUT”."]]]},
  {s:"result",m:{ads:3,secs:90,bal:"6",got:"$0"},
   t:["Підсумок: реклама показана, Netflix немає","Итог: реклама показана, Netflix нет","Result: ads were shown, no Netflix"],
   l:["Людина прийшла по Netflix, подивилась рекламу, пройшла ігри й не отримала нічого. mRewards уже заробив на кожному показі й кожному гравці.","Человек пришёл за Netflix, посмотрел рекламу, прошёл игры и не получил ничего. mRewards уже заработал на каждом показе и каждом игроке.","The user came for Netflix, watched ads, played games and got nothing. mRewards has already earned on every impression and every player."],
   h:null,
   mo:["Дохід: покази реклами + оплата від рекламодавців ігор. Витрати на нагороди мінімальні, бо до картки доходять одиниці.","Доход: показы рекламы + оплата от рекламодателей игр. Расходы на награды минимальны, потому что до карты доходят единицы.","Revenue: ad impressions plus game advertisers’ payments. Reward costs are minimal because very few reach a card."],
   f:[["ok",["34 % негативних відгуків 2025–2026 років — про те, що нагороду не віддали або не зарахували.","34 % негативных отзывов 2025–2026 годов — о том, что награду не отдали или не засчитали.","34% of negative reviews from 2025–2026 say the reward wasn’t paid or credited."]]]}
  ]},
 b:{pkg:"com.justplay.app",name:"JustPlay",tab:["JustPlay · «гроші кожні 3 години»","JustPlay · «деньги каждые 3 часа»","JustPlay · “cash every 3 hours”"],q:"earn gift cards",unit:["монет","монет","coins"],shots:["j0","j1","j4"],
  summary:"Earn Real While You Play… cash out every 3 hours through PayPal or swap your coins for gift cards. No subscriptions. No paywalls.",
  steps:[
  {s:"store",m:{ads:0,secs:0,bal:"0",got:"$0"},
   t:["Обіцянка в Play: виплати кожні 3 години","Обещание в Play: выплаты каждые 3 часа","The Play promise: payouts every 3 hours"],
   l:["Скріни: «Real payouts every 3 hours», «PayPal: You received $2.21», «0% fees, 100% yours». В описі: «No subscriptions. No paywalls».","Скрины: «Real payouts every 3 hours», «PayPal: You received $2.21», «0% fees, 100% yours». В описании: «No subscriptions. No paywalls».","Screenshots: “Real payouts every 3 hours”, “PayPal: You received $2.21”, “0% fees, 100% yours”. Listing: “No subscriptions. No paywalls”."],
   h:["натисніть «Встановити»","нажмите «Установить»","tap “Install”"],
   mo:["Поки нічого. Картка позначена «Містить рекламу».","Пока ничего. Карточка помечена «Содержит рекламу».","Nothing yet. The listing says “Contains ads”."],
   f:[["ok",["40,1 млн встановлень, оцінка 4,43★, 1,7 млн оцінок. Розробник — JustPlay GmbH, Німеччина.","40,1 млн установок, оценка 4,43★, 1,7 млн оценок. Разработчик — JustPlay GmbH, Германия.","40.1M installs, 4.43★, 1.7M ratings. Developer: JustPlay GmbH, Germany."]],["ok",["Скарг на рекламу — 43 % негативних відгуків, найбільше серед 13 застосунків.","Жалоб на рекламу — 43 % негативных отзывов, больше всего среди 13 приложений.","Ad complaints: 43% of negative reviews, the most of the 13 apps."]]]},
  {s:"jpHome",m:{ads:0,secs:0,bal:"0",got:"$0"},
   t:["Каталог власних ігор","Каталог собственных игр","A catalog of in-house games"],
   l:["Людина обирає одну з 30+ ігор: Tile Match Pro, Treasure Master, Word Seeker. За гру нараховують «монети лояльності».","Человек выбирает одну из 30+ игр: Tile Match Pro, Treasure Master, Word Seeker. За игру начисляют «монеты лояльности».","The user picks one of 30+ games: Tile Match Pro, Treasure Master, Word Seeker. Play earns “loyalty coins”."],
   h:["натисніть «Tile Match Pro»","нажмите «Tile Match Pro»","tap “Tile Match Pro”"],
   mo:["Ігри свої, тож уся реклама в них — дохід JustPlay. Плюс офери Tapjoy для тих, хто хоче більше.","Игры свои, поэтому вся реклама в них — доход JustPlay. Плюс офферы Tapjoy для тех, кто хочет больше.","The games are in-house, so all their ads are JustPlay revenue. Plus Tapjoy offers for those who want more."],
   f:[["ok",["Назви ігор — з опису в Play. Офери Tapjoy згадуються у відгуку 14.09.2026.","Названия игр — из описания в Play. Офферы Tapjoy упоминаются в отзыве 14.09.2026.","Game names are from the Play listing; Tapjoy offers are mentioned in a review on 14 Sep 2026."]]]},
  {s:"jpGame",ad:"c2",m:ph=>({ads:2+ph,secs:75+45*ph,bal:(150000*(1+ph)).toLocaleString("en-US").replace(/,/g," "),got:"$0"}),
   t:["Гра з рекламою кожні 20–30 секунд","Игра с рекламой каждые 20–30 секунд","A game with ads every 20–30 seconds"],
   l:["Під полем гри — рекламний банер, який, за відгуками, оновлюється кожні 20 секунд. Після рівня — повноекранний ролик на 15–60 секунд. Натисніть «Наступний рівень» кілька разів.","Под полем игры — рекламный баннер, который, по отзывам, обновляется каждые 20 секунд. После уровня — полноэкранный ролик на 15–60 секунд. Нажмите «Следующий уровень» несколько раз.","Under the board sits a banner that, per reviews, refreshes every 20 seconds. After a level: a 15–60 second full-screen video. Tap “Next level” a few times."],
   h:["закрийте рекламу й натисніть «Наступний рівень»","закройте рекламу и нажмите «Следующий уровень»","close the ad and tap “Next level”"],
   mo:["Головне джерело доходу. Гра — привід показати рекламу: банер увесь час і ролик між рівнями.","Главный источник дохода. Игра — повод показать рекламу: баннер всё время и ролик между уровнями.","The main revenue source. The game is a reason to show ads: a banner all the time and a video between levels."],
   f:[["ok",["Відгук 16.07.2026: «an ad box that stays on the screen and plays every 20 seconds… the ad break every 30 seconds».","Отзыв 16.07.2026: «an ad box that stays on the screen and plays every 20 seconds… the ad break every 30 seconds».","Review, 16 Jul 2026: “an ad box that stays on the screen and plays every 20 seconds… the ad break every 30 seconds”."]],["ok",["Відгук 29.07.2026: аудіореклама грає по колу під час гри, відео — кожні 4–5 раундів.","Отзыв 29.07.2026: аудиореклама играет по кругу во время игры, видео — каждые 4–5 раундов.","Review, 29 Jul 2026: audio ads loop during play, a video every 4–5 rounds."]]],
   policy:["Play забороняє повноекранну рекламу, що з’являється «unexpectedly», коли людина робить щось інше. Ролик посеред рівня під це підпадає.","Play запрещает полноэкранную рекламу, появляющуюся «unexpectedly», когда человек делает что-то другое. Ролик посреди уровня под это подпадает.","Play bans full-screen ads that appear “unexpectedly” while the user is doing something else. A video mid-level fits that."],
   q:{st:3,dt:"03.09.2026",lk:6,en:"you’re getting paid to watch ads. The games are just a ploy.",uk:"Тобі платять за перегляд реклами. Ігри — лише привід.",ru:"Тебе платят за просмотр рекламы. Игры — лишь повод."}},
  {s:"jpBonus",ad:"c3",m:{ads:5,secs:255,bal:"475 000",got:"$0"},
   t:["«+25 000 монет за рекламу»","«+25 000 монет за рекламу»","“+25,000 coins for an ad”"],
   l:["Застосунок пропонує подивитися ще одну рекламу заради 25 000 монет. Число велике, але в доларах це центи.","Приложение предлагает посмотреть ещё одну рекламу ради 25 000 монет. Число большое, но в долларах это центы.","The app offers one more ad for 25,000 coins. The number is big, but it’s cents in dollars."],
   h:["натисніть «Подивитися» і закрийте рекламу","нажмите «Посмотреть» и закройте рекламу","tap “Watch” and close the ad"],
   mo:["Великі числа монет роблять нагороду відчутною, а курс приховує, що це центи.","Большие числа монет делают награду ощутимой, а курс скрывает, что это центы.","Big coin numbers make the reward feel real; the rate hides that it’s cents."],
   f:[["ok",["Відгук 15.07.2026: «Even receiving 25,000 coins (after an advertisement) you only get maybe .20 cents».","Отзыв 15.07.2026: «Even receiving 25,000 coins (after an advertisement) you only get maybe .20 cents».","Review, 15 Jul 2026: “Even receiving 25,000 coins (after an advertisement) you only get maybe .20 cents”."]]]},
  {s:"jpCash",m:{ads:40,secs:2400,bal:"21 000 000",got:"$0"},
   t:["Через 2 години: 21 млн монет = $2","Через 2 часа: 21 млн монет = $2","Two hours later: 21M coins = $2"],
   l:["Після двох годин гри на балансі 21 мільйон монет. При виводі це $2. Курс не фіксований: ті самі монети можуть дати і 50, і 5 центів.","После двух часов игры на балансе 21 миллион монет. При выводе это $2. Курс не фиксирован: те же монеты могут дать и 50, и 5 центов.","After two hours of play the balance is 21 million coins. Cashed out, that’s $2. The rate isn’t fixed: the same coins can be 50 or 5 cents."],
   h:["натисніть «Вивести»","нажмите «Вывести»","tap “Cash out”"],
   mo:["◌ Людина отримує близько $1 за годину, за яку подивилась десятки реклам. Решта доходу від показів лишається JustPlay.","◌ Человек получает около $1 за час, за который посмотрел десятки реклам. Остальной доход от показов остаётся JustPlay.","◌ The user gets about $1 an hour after watching dozens of ads. The rest of the ad revenue stays with JustPlay."],
   f:[["ok",["Відгук 26.08.2025 (692 позначки «корисно»): «My 21 million loyalty coins were $2… $1 per hr».","Отзыв 26.08.2025 (692 отметки «полезно»): «My 21 million loyalty coins were $2… $1 per hr».","Review, 26 Aug 2025 (692 helpful): “My 21 million loyalty coins were $2… $1 per hr”."]],["ok",["Відгук 28.02.2026: «same amount of points can get you 50 cents or 5 cents».","Отзыв 28.02.2026: «same amount of points can get you 50 cents or 5 cents».","Review, 28 Feb 2026: “same amount of points can get you 50 cents or 5 cents”."]]],
   q:{st:2,dt:"26.08.2025",lk:692,en:"Super long annoying game ads. My 21 million loyalty coins were $2. $1 per hr.",uk:"Дуже довга набридлива реклама в іграх. Мої 21 мільйон монет лояльності — це $2. $1 за годину.",ru:"Очень длинная надоедливая реклама в играх. Мои 21 миллион монет лояльности — это $2. $1 в час."}},
  {s:"jpTimer",m:{ads:40,secs:2400,bal:"$2,00",got:"$0"},
   t:["«Зачекайте ще 3 години» і скан обличчя","«Подождите ещё 3 часа» и скан лица","“Wait another 3 hours” and a face scan"],
   l:["Вивід — раз на 3 години. Частина людей пише, що таймер перезапускається знову й знову. Для сум від ~$11 застосунок просить скан обличчя.","Вывод — раз в 3 часа. Часть людей пишет, что таймер перезапускается снова и снова. Для сумм от ~$11 приложение просит скан лица.","Cash-out is once every 3 hours. Some users say the timer restarts again and again. From about $11, the app asks for a face scan."],
   h:["натисніть «Підтвердити обличчя»","нажмите «Подтвердить лицо»","tap “Verify face”"],
   mo:["Поки таймер іде, людина грає далі й дивиться рекламу.","Пока таймер идёт, человек играет дальше и смотрит рекламу.","While the timer runs, the user keeps playing and watching ads."],
   f:[["ok",["Відгук 29.08.2025 (901 позначка «корисно»): «it acts like you need to wait another 3 hours… does it again and again and I can't cash out».","Отзыв 29.08.2025 (901 отметка «полезно»): «it acts like you need to wait another 3 hours… does it again and again and I can't cash out».","Review, 29 Aug 2025 (901 helpful): “it acts like you need to wait another 3 hours… does it again and again and I can't cash out”."]],["ok",["Відгук 10.08.2026: при виводі $11 — скан обличчя, «your face is associated with another account».","Отзыв 10.08.2026: при выводе $11 — скан лица, «your face is associated with another account».","Review, 10 Aug 2026: cashing out $11 required a face scan — “your face is associated with another account”."]]],
   q:{st:1,dt:"29.08.2025",lk:901,en:"suddenly it acts like you need to wait another 3 hours to cash out… yet does it again and again and I can’t cash out.",uk:"Раптом застосунок каже, що треба чекати ще 3 години до виводу… і так знову й знову, вивести не можу.",ru:"Вдруг приложение говорит, что нужно ждать ещё 3 часа до вывода… и так снова и снова, вывести не могу."}},
  {s:"result",m:{ads:40,secs:2400,bal:"$2,00",got:"$0–2"},
   t:["Підсумок: година гри = десятки реклам і ~$1","Итог: час игры = десятки реклам и ~$1","Result: an hour of play = dozens of ads and ~$1"],
   l:["JustPlay справді платить, але мало: це не «обіцяють і не дають», а «обіцяють гроші, дають центи». Відгуки кажуть прямо: ігри тут — привід показати рекламу.","JustPlay действительно платит, но мало: это не «обещают и не дают», а «обещают деньги, дают центы». Отзывы говорят прямо: игры здесь — повод показать рекламу.","JustPlay does pay, but little: it’s not “promise and don’t pay” but “promise money, pay cents”. Reviews say it plainly: the games are a reason to show ads."],
   h:null,
   mo:["Дохід: реклама у власних іграх (банер, ролики, rewarded «+25 000») і офери. Нагорода людині — центи за десятки показів.","Доход: реклама в собственных играх (баннер, ролики, rewarded «+25 000») и офферы. Награда человеку — центы за десятки показов.","Revenue: ads in in-house games (banner, videos, rewarded “+25,000”) plus offers. The user gets cents for dozens of impressions."],
   f:[["ok",["36 % негативних відгуків — про невиплату або незараховане, 43 % — про рекламу.","36 % негативных отзывов — о невыплате или незачтённом, 43 % — о рекламе.","36% of negative reviews are about non-payment or uncredited tasks, 43% about ads."]]]}
  ]},
 c:{pkg:"tyr.rewards",name:"Try Rewards",tab:["Try Rewards · «$500 за гру»","Try Rewards · «$500 за игру»","Try Rewards · “$500 per game”"],q:"play games earn gift cards",unit:["$","$","$"],shots:["t0","t1","t3"],
  summary:"Play hard. Cash out fast! Redeem your points for gift cards… Uber, Spotify, and many more!",
  steps:[
  {s:"store",m:{ads:0,secs:0,bal:"$0",got:"$0"},
   t:["Обіцянка в Play: сотні доларів за гру","Обещание в Play: сотни долларов за игру","The Play promise: hundreds of dollars per game"],
   l:["Скріни: «Play hard. Cash out fast!», «$5 instant sign up bonus», Monopoly Go — $361,62, RAID — $521,67. В описі серед нагород — Spotify.","Скрины: «Play hard. Cash out fast!», «$5 instant sign up bonus», Monopoly Go — $361,62, RAID — $521,67. В описании среди наград — Spotify.","Screenshots: “Play hard. Cash out fast!”, “$5 instant sign up bonus”, Monopoly Go $361.62, RAID $521.67. The listing names Spotify among rewards."],
   h:["натисніть «Встановити»","нажмите «Установить»","tap “Install”"],
   mo:["Поки нічого.","Пока ничего.","Nothing yet."],
   f:[["ok",["2,5 млн встановлень, оцінка 4,18★, 14,1 % одиниць. Розробник — Tyrads.","2,5 млн установок, оценка 4,18★, 14,1 % единиц. Разработчик — Tyrads.","2.5M installs, 4.18★, 14.1% 1★. Developer: Tyrads."]],["ok",["66 % негативних відгуків — «не віддали»: найбільше серед 13 застосунків.","66 % негативных отзывов — «не отдали»: больше всего среди 13 приложений.","66% of negative reviews say “didn’t pay”, the most of the 13 apps."]]]},
  {s:"trOffers",m:{ads:0,secs:0,bal:"$5",got:"$0"},
   t:["Офери: чужі ігри за великі гроші","Офферы: чужие игры за большие деньги","Offers: other companies’ games for big money"],
   l:["Бонус $5 на старті й список ігор із сумами до $521. Гроші нараховуються за «віхи»: рівні, дні в грі й покупки в грі.","Бонус $5 на старте и список игр с суммами до $521. Деньги начисляются за «вехи»: уровни, дни в игре и покупки в игре.","A $5 sign-up bonus and a list of games worth up to $521. Money is credited for “milestones”: levels, days in the game and in-game purchases."],
   h:["натисніть на RAID","нажмите на RAID","tap RAID"],
   mo:["Це гроші рекламодавця гри: він платить Try Rewards за гравця, який довго грає й купує. Частину віддають людині.","Это деньги рекламодателя игры: он платит Try Rewards за игрока, который долго играет и покупает. Часть отдают человеку.","This is the game advertiser’s money: it pays Try Rewards for a player who plays long and buys. Part goes to the user."],
   f:[["ok",["Суми $361,62 і $521,67 — на скрінах Try Rewards у Google Play.","Суммы $361,62 и $521,67 — на скринах Try Rewards в Google Play.","The $361.62 and $521.67 amounts are on Try Rewards’s Google Play screenshots."]]]},
  {s:"trBuy",m:{ads:0,secs:0,bal:"$15",got:"$0"},
   t:["Віха: купи в грі — отримаєш стільки ж","Веха: купи в игре — получишь столько же","Milestone: buy in-game, get the same back"],
   l:["Частина віх — це покупки в грі. Людина платить $9,99 у RAID і отримує $10 на баланс Try Rewards.","Часть вех — это покупки в игре. Человек платит $9,99 в RAID и получает $10 на баланс Try Rewards.","Some milestones are in-game purchases. The user pays $9.99 in RAID and gets $10 in Try Rewards balance."],
   h:["натисніть «Купити $9,99»","нажмите «Купить $9,99»","tap “Buy $9.99”"],
   mo:["Рекламодавець гри платить за «платника», а людина фактично повертає собі власні гроші.","Рекламодатель игры платит за «плательщика», а человек фактически возвращает себе свои же деньги.","The game advertiser pays for a “payer”, while the user basically gets their own money back."],

  $("#appcards").innerHTML=P.map(([p,pr])=>{ const a=A(p); const hist=[a.hh[4],a.hh[3],a.hh[2],a.hh[1],a.hh[0]];
   return '<article class="appcard"><div class="ac-head">'+icon(a,"lg")+'<div><p class="k">'+esc(p)+'</p><h3 class="ac-name"><a href="'+play(p)+'" target="_blank" rel="noopener">'+esc(a.n)+'</a></h3></div></div>'+
   '<dl class="kv"><div><dt>'+esc(t("kv.promise"))+'</dt><dd>'+esc(tr(pr))+'</dd></div><div><dt>'+esc(t("kv.dev"))+'</dt><dd>'+esc(a.dev)+'</dd></div><div><dt>'+esc(t("kv.inst"))+'</dt><dd>'+esc(fmtI(a.i))+'</dd></div><div><dt>'+esc(t("kv.rating"))+'</dt><dd>'+esc(dec(a.s))+' ★</dd></div><div><dt>'+esc(t("kv.ratings"))+'</dt><dd>'+grp(a.r)+'</dd></div><div><dt>'+esc(t("kv.since"))+'</dt><dd>'+esc(fmtD(a.rel))+'</dd></div><div><dt>'+esc(t("kv.upd"))+'</dt><dd>'+esc(fmtD(a.upd))+'</dd></div><div><dt>'+esc(t("kv.blk"))+'</dt><dd>'+esc(pct(a.blk))+'</dd></div></dl>'+
   '<div class="hist"><p class="hist-title">'+esc(t("hist"))+'</p>'+hist.map((v,j)=>'<div class="hrow"><span class="lab">'+(5-j)+'★</span><span class="htrack"><i style="width:'+v+'%"></i></span><span class="val">'+esc(pct(dec(v)))+'</span></div>').join("")+'</div></article>'; }).join(""); }
function renderModel(){ $("#flow3").innerHTML=FLOW3.map((f,i)=>'<div class="f3 '+(i===2?"money":i===4?"loss":"")+'"><b>'+esc(tr(f[0]))+'</b><span>'+esc(tr(f[1]))+'</span></div>').join('<span class="arr" aria-hidden="true">→</span>');
  $("#mtable").innerHTML='<thead><tr><th>'+esc(t("mt.app"))+'</th><th>'+esc(t("mt.who"))+'</th><th>'+esc(t("mt.user"))+'</th><th>'+esc(t("mt.trap"))+'</th></tr></thead><tbody>'+MODEL.map(m=>'<tr><td><div class="appcell">'+icon(A(m.p))+'<b>'+esc(m.n)+'</b></div></td><td>'+esc(tr(m.who))+'</td><td>'+esc(tr(m.u))+'</td><td>'+esc(tr(m.tr))+'</td></tr>').join("")+'</tbody>'; }
let reward=10;
function renderCalc(){ $("#rpre").innerHTML=[5,10,15,25].map(v=>'<button type="button" data-v="'+v+'" aria-pressed="'+(v===reward)+'">$'+v+'</button>').join(""); calc(); }
function calc(){ const e=+$("#ecpm").value, sh=+$("#share").value/100; $("#ecpmv").textContent="$"+e; $("#sharev").textContent=pct(Math.round(sh*100)); const ads=Math.ceil(reward*1000/(e*sh)), hrs=ads*30/3600; $("#oads").textContent=grp(ads); $("#ohours").textContent=dec(hrs<10?hrs.toFixed(1):Math.round(hrs)); }
let curApp="tyr.rewards";
function renderReviews(){ const rows=APPS.slice().sort((a,b)=>b.blk-a.blk);
  $("#bars").innerHTML=rows.map(a=>'<button type="button" class="brow'+(a.p==="com.google.android.apps.paidtasks"?" ctl":"")+'" data-p="'+a.p+'" aria-pressed="'+(a.p===curApp)+'"><span class="lab">'+esc(shortN(a))+'</span><span class="bplot"><i style="width:'+Math.max(1,100*a.blk/80)+'%"></i></span><span class="val">'+esc(pct(a.blk))+'</span></button>').join("");
  $("#bticks").innerHTML=[0,20,40,60,80].map((v,i)=>'<span style="left:'+(i*25)+'%">'+esc(pct(v))+'</span>').join("");
  const a=A(curApp), q=AQ[curApp];
  $("#acard").innerHTML='<div class="ph">'+icon(a,"lg")+'<div><h3><a href="'+play(a.p)+'" target="_blank" rel="noopener">'+esc(a.n)+'</a></h3><p class="meta">'+esc(fmtI(a.i))+' '+esc(t("a.inst"))+' · ★ '+esc(dec(a.s))+' · 1★ '+esc(pct(dec(a.h1)))+'</p></div></div><dl class="dl"><div><dt>'+esc(t("a.stream"))+'</dt><dd>'+esc(tr(q.stream))+'</dd></div></dl><p class="lbl">'+esc(t("a.quotes"))+'</p>'+q.q.map(x=>qcard(x,shortN(a))).join(""); }
function renderRest(){
  $("#whycards").innerHTML=WHY.map(w=>'<article class="card"><h3>'+esc(tr(w.h))+'</h3><p>'+esc(tr(w.p))+'</p></article>').join("");
  $("#nlist").innerHTML=NOTES.map(n=>'<article class="nt"><h3>'+esc(tr(n.h))+'</h3><div class="nt-row"><span class="tag ok">✔</span><p><span class="lb">'+esc(t("n.fact"))+'</span>'+esc(tr(n.f))+'</p></div><div class="nt-row"><span class="tag guess">◌</span><p><span class="lb">'+esc(t("n.mean"))+'</span>'+esc(tr(n.m))+'</p></div><div class="nt-row"><span class="chk" aria-hidden="true">?</span><p><span class="lb">'+esc(t("n.check"))+'</span>'+esc(tr(n.c))+'</p></div></article>').join("");
  $("#rlist").innerHTML=RULES.map(r=>'<figure class="rule2"><blockquote lang="en">“'+esc(r.q)+'”</blockquote><figcaption><a href="'+r.url+'" target="_blank" rel="noopener">'+esc(r.src)+'</a></figcaption><p><span class="lbl">'+esc(t("ru.mean"))+'</span>'+esc(tr(r.m))+'</p></figure>').join("");
  $("#golist").innerHTML=GO.map(x=>'<li>'+esc(tr(x))+'</li>').join(""); $("#nolist").innerHTML=NO.map(x=>'<li>'+esc(tr(x))+'</li>').join("");
  $("#rtable").innerHTML='<thead><tr><th>'+esc(t("rt.svc"))+'</th><th>'+esc(t("rt.st"))+'</th><th>'+esc(t("rt.route"))+'</th></tr></thead><tbody>'+ROUTES.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td><span class="verd '+(r[1]==="ok"?"ok":r[1]==="mid"?"mixed":"bad")+'">'+(r[1]==="ok"?"✔ ":r[1]==="mid"?"◐ ":"✗ ")+esc(t("st."+r[1]))+'</span></td><td>'+esc(tr(r[2]))+'</td></tr>').join("")+'</tbody>';
  $("#method").innerHTML=METHOD.map(m=>'<li>'+esc(tr(m))+'</li>').join(""); $("#changes").innerHTML=CHANGES.map(m=>'<li>'+esc(tr(m))+'</li>').join("");
  $("#sources").innerHTML=SOURCES.map(s=>'<li><a href="'+s[0]+'" target="_blank" rel="noopener">'+esc(tr(s[1]))+'</a><small>'+esc(tr(s[2]))+'</small></li>').join(""); }
function renderAll(){ applyStatic(); renderTabs(); render(); renderAppCards(); renderModel(); renderCalc(); renderReviews(); renderRest(); }
function setLang(c,save){ const i=LANGS.indexOf(c); if(i<0) return; L=i; renderAll(); if(save){ try{localStorage.setItem("st2-lang",c)}catch(e){} } }
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("button[data-lang]"); if(b) setLang(b.dataset.lang,true)});
$("#rpre").addEventListener("click",e=>{const b=e.target.closest("button[data-v]"); if(!b) return; reward=+b.dataset.v; renderCalc();});
["ecpm","share"].forEach(id=>$("#"+id).addEventListener("input",calc));
$("#bars").addEventListener("click",e=>{const b=e.target.closest(".brow"); if(!b) return; curApp=b.dataset.p; renderReviews();});
let start="uk"; const h=(location.hash||"").slice(1);
if(LANGS.includes(h)) start=h; else { try{const s=localStorage.getItem("st2-lang"); if(LANGS.includes(s)) start=s;}catch(e){} }
setLang(start,false);
window.addEventListener("hashchange",()=>{const x=(location.hash||"").slice(1); if(LANGS.includes(x)) setLang(x,true);});
})();
</script>
